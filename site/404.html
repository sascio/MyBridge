<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamBridge</title>
<meta name="robots" content="noindex">
<script>
(function () {
  "use strict";
  // Static hosting cannot rewrite /party/<code> to the invite page, so this
  // not-found page forwards path-style invite links to the canonical form and
  // sends every other unknown path to the site root.
  var base = window.location.hostname === "sascio.github.io" ? "/MyBridge/" : "/";
  var path = window.location.pathname;
  var prefix = base === "/MyBridge/" ? "/MyBridge/party/" : "/party/";
  if (path.indexOf(prefix) === 0) {
    var code = path.slice(prefix.length).replace(/\/$/, "");
    if (/^[A-HJ-NP-Z2-9]{6}$/i.test(code)) {
      window.location.replace(base + "party/?code=" + encodeURIComponent(code.toUpperCase()));
      return;
    }
  }
  window.location.replace(base);
})();
</script>
</head>
<body>
<p>Redirecting&hellip; <a href="https://streambridgeapp.pages.dev/">StreamBridge</a></p>
</body>
</html>
