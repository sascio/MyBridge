name: Update Sideload Source

# Publishes a released StreamBridge version into store.json, the AltStore and
# SideStore source that points at the unsigned iOS IPA. Ported from
# NuvioMedia/NuvioMobile 0.5.5-beta (.github/workflows/update-store-source.yml).
#
# Triggers when a GitHub release is published, so store.json always describes the
# real published asset: the IPA is downloaded from the release, its digest and
# size are verified against the release metadata, and the script refuses anything
# that is signed, mis-branded or of the wrong version.
#
# Release lookup lives in scripts/release-lookup.sh so its failure modes are
# covered by scripts/tests/release-lookup-test.sh. The v0.1.13 release failed here
# because `GET /releases/tags/v0.1.13` answers 404 for a *draft* release, which the
# previous inline lookup reported as a fatal `gh: Not Found`:
#
#   * a draft release    -> skip (store.json must never describe an unpublished release)
#   * no IPA yet         -> skip (Android and iOS publish independently)
#   * release missing    -> bounded retry, then a hard failure
#   * 401/403/5xx        -> hard failure, never a silent skip
#
# The release channel is the default branch because AltStore fetches store.json
# over raw.githubusercontent.com from a stable ref. Set the repository variable
# STREAMBRIDGE_SOURCE_BRANCH to publish the source from a different branch.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. v0.1.08)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sideload-source-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update store.json
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
      SOURCE_BRANCH: ${{ vars.STREAMBRIDGE_SOURCE_BRANCH || github.event.repository.default_branch }}
      ICON_PATH: iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png

    steps:
      - name: Check out the source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Resolve the published release and its IPA
        id: ipa
        run: |
          set -uo pipefail
          rc=0
          # Blocks until the release is published, with a bounded retry for the
          # brief window between "release created" and "release visible". The
          # script writes skip=true to $GITHUB_OUTPUT for the two skip cases.
          scripts/release-lookup.sh resolve \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --json "${RUNNER_TEMP}/release.json" \
            --attempts 6 \
            --delay 10 || rc=$?
          case "${rc}" in
            0) ;;
            20|22) exit 0 ;;
            *) echo "::error::Release lookup for ${RELEASE_TAG} failed with exit ${rc}."; exit "${rc}" ;;
          esac

      - name: Download and verify the published IPA
        id: download
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/release.json"
          ipa_name="${{ steps.ipa.outputs.ipa_name }}"
          if [[ -z "${ipa_name}" ]]; then
            echo "::error::No IPA name was resolved for ${RELEASE_TAG}."
            exit 1
          fi

          mkdir -p source-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ipa_name}" \
            --dir source-assets

          # Size and, when the API exposes it, the SHA-256 digest must match the
          # release asset before its metadata can reach store.json.
          scripts/release-lookup.sh verify-asset \
            --file "source-assets/${ipa_name}" \
            --name "${ipa_name}" \
            --json "${release_json}"

      - name: Update sideload source
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/release.json"
          release_notes="${RUNNER_TEMP}/release-notes.md"
          ipa_name="${{ steps.ipa.outputs.ipa_name }}"
          release_date="$(jq -r '.published_at // empty' "${release_json}")"
          download_url="${{ steps.ipa.outputs.ipa_url }}"

          if [[ -z "${release_date}" ]]; then
            echo "::error::Published release ${RELEASE_TAG} has no publication date."
            exit 1
          fi
          if [[ -z "${download_url}" || "${download_url}" == "null" ]]; then
            echo "::error::Published release ${RELEASE_TAG} has no download URL for ${ipa_name}."
            exit 1
          fi

          jq -rj '.body // ""' "${release_json}" > "${release_notes}"

          # The icon is served from the immutable release tag, so the source never
          # points at a stale or branch-dependent asset.
          icon_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_TAG}/${ICON_PATH}"

          python3 scripts/update-store-source.py \
            --source store.json \
            --ipa "source-assets/${ipa_name}" \
            --release-notes "${release_notes}" \
            --release-version "${RELEASE_VERSION#v}" \
            --release-date "${release_date}" \
            --download-url "${download_url}" \
            --icon-url "${icon_url}"

      - name: Verify the source only advertises downloadable assets
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # store.json is what AltStore follows, so every URL it publishes has to
          # resolve right now. This also catches a typo in the download URL or a
          # download URL that github.com has already stopped serving.
          failed=0
          while IFS= read -r url; do
            [[ -z "${url}" || "${url}" == "null" ]] && continue
            # A one-byte range request keeps the check cheap for a 70 MB IPA while
            # still proving that github.com serves the asset right now.
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 --retry 3 --retry-delay 2 --max-time 60 "${url}" || echo 000)"
            if [[ "${code}" == "200" ]]; then
              echo "store.json asset reachable: ${url}"
            else
              echo "::error::store.json advertises ${url}, which answered HTTP ${code}."
              failed=1
            fi
          done < <(jq -r '.apps[].versions[] | .downloadURL' store.json)
          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

      - name: Commit sideload source
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- store.json)" ]]; then
            echo "store.json is already current for ${RELEASE_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          git commit -m "chore(store): publish ${RELEASE_VERSION}"
          git push origin "HEAD:${SOURCE_BRANCH}"
