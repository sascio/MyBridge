name: Update Sideload Source

# Publishes a released StreamBridge version into store.json, the AltStore and
# SideStore source that points at the verified iOS IPA. Ported from
# NuvioMedia/NuvioMobile 0.5.5-beta (.github/workflows/update-store-source.yml).
#
# Triggers when a GitHub release is published, so store.json always describes the
# real published asset: the IPA is downloaded from the release, its digest and
# size are verified against the release metadata, and the script refuses anything
# that is mis-branded or of the wrong version. Signed releases also require
# independent macOS signature and provisioning verification before source update.
#
# Release lookup lives in scripts/release-lookup.sh so its failure modes are
# covered by scripts/tests/release-lookup-test.sh. The v0.1.13 release failed here
# because `GET /releases/tags/v0.1.13` answers 404 for a *draft* release, which the
# previous inline lookup reported as a fatal `gh: Not Found`:
#
#   * a draft release    -> skip (store.json must never describe an unpublished release)
#   * no IPA yet         -> skip (Android and iOS publish independently)
#   * release missing    -> bounded retry, then a hard failure
#   * 401/403/5xx        -> hard failure, never a silent skip
#
# The release channel is the default branch because AltStore fetches store.json
# over raw.githubusercontent.com from a stable ref. Set the repository variable
# STREAMBRIDGE_SOURCE_BRANCH to publish the source from a different branch.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. v0.1.08)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write # Open the store.json pull request when the source branch is PR-protected.

concurrency:
  group: sideload-source-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-signed-ipa:
    name: Verify signed release IPA before source update
    runs-on: xcode-27
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.inspect.outputs.signed }}
      sha256: ${{ steps.inspect.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - name: Inspect published release and verify signed IPA
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TEAM_ID: ${{ secrets.STREAMBRIDGE_IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.STREAMBRIDGE_IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/store-release.json"
          rc=0
          scripts/release-lookup.sh resolve --repo "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" --json "${release}" --attempts 6 --delay 10 || rc=$?
          case "${rc}" in 0) ;; 20|22) echo "signed=false" >> "${GITHUB_OUTPUT}"; exit 0;; *) exit "${rc}";; esac
          name="$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .name' "${release}")"
          if [[ "${name}" == *-iOS-unsigned.ipa ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${name}" == "StreamBridge-${RELEASE_TAG#v}-iOS-signed.ipa" ]] || { echo "::error::Unexpected signed IPA name"; exit 1; }
          [[ -n "${TEAM_ID}" ]] || { echo "::error::Missing STREAMBRIDGE_IOS_TEAM_ID"; exit 1; }
          case "${EXPORT_METHOD}" in ad-hoc|enterprise) ;; *) echo "::error::Missing STREAMBRIDGE_IOS_EXPORT_METHOD variable"; exit 1;; esac
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${name}" --dir "${RUNNER_TEMP}/store-ipa"
          file="${RUNNER_TEMP}/store-ipa/${name}"
          digest="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .digest // empty' "${release}")"
          size="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .size' "${release}")"
          [[ "${digest}" == "sha256:$(shasum -a 256 "${file}" | awk '{print $1}')" ]] || { echo "::error::IPA digest mismatch or missing"; exit 1; }
          [[ "${size}" == "$(wc -c < "${file}" | tr -d ' ')" ]] || { echo "::error::IPA size mismatch"; exit 1; }
          python3 scripts/ios-signing.py verify --ipa "${file}" --team "${TEAM_ID}" \
            --method "${EXPORT_METHOD}" --version "${RELEASE_TAG#v}"
          echo "sha256=${digest#sha256:}" >> "${GITHUB_OUTPUT}"
          echo "signed=true" >> "${GITHUB_OUTPUT}"

  update:
    needs: [verify-signed-ipa]
    name: Update store.json
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_VERSION: ${{ inputs.version || inputs.tag || github.event.release.tag_name }}
      SOURCE_BRANCH: ${{ vars.STREAMBRIDGE_SOURCE_BRANCH || github.event.repository.default_branch }}
      ICON_PATH: iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png

    steps:
      - name: Check out the source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Resolve the published release and its IPA
        id: ipa
        run: |
          set -uo pipefail
          rc=0
          # Blocks until the release is published, with a bounded retry for the
          # brief window between "release created" and "release visible". The
          # script writes skip=true to $GITHUB_OUTPUT for the two skip cases.
          scripts/release-lookup.sh resolve \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --json "${RUNNER_TEMP}/release.json" \
            --attempts 6 \
            --delay 10 || rc=$?
          case "${rc}" in
            0) ;;
            20|22) exit 0 ;;
            *) echo "::error::Release lookup for ${RELEASE_TAG} failed with exit ${rc}."; exit "${rc}" ;;
          esac

      - name: Download and verify the published IPA
        id: download
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/release.json"
          ipa_name="${{ steps.ipa.outputs.ipa_name }}"
          if [[ -z "${ipa_name}" ]]; then
            echo "::error::No IPA name was resolved for ${RELEASE_TAG}."
            exit 1
          fi

          mkdir -p source-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ipa_name}" \
            --dir source-assets

          # Size and, when the API exposes it, the SHA-256 digest must match the
          # release asset before its metadata can reach store.json.
          scripts/release-lookup.sh verify-asset \
            --file "source-assets/${ipa_name}" \
            --name "${ipa_name}" \
            --json "${release_json}"

      - name: Update sideload source
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/release.json"
          release_notes="${RUNNER_TEMP}/release-notes.md"
          ipa_name="${{ steps.ipa.outputs.ipa_name }}"
          release_date="$(jq -r '.published_at // empty' "${release_json}")"
          download_url="${{ steps.ipa.outputs.ipa_url }}"

          if [[ -z "${release_date}" ]]; then
            echo "::error::Published release ${RELEASE_TAG} has no publication date."
            exit 1
          fi
          if [[ -z "${download_url}" || "${download_url}" == "null" ]]; then
            echo "::error::Published release ${RELEASE_TAG} has no download URL for ${ipa_name}."
            exit 1
          fi

          jq -rj '.body // ""' "${release_json}" > "${release_notes}"

          # The icon is served from the immutable release tag, so the source never
          # points at a stale or branch-dependent asset.
          icon_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_TAG}/${ICON_PATH}"

          signed_arg=()
          if [[ "${{ needs.verify-signed-ipa.outputs.signed }}" == true ]]; then
            [[ "${{ needs.verify-signed-ipa.outputs.sha256 }}" == "${{ steps.download.outputs.sha256 }}" ]] || {
              echo "::error::Downloaded IPA differs from the independently verified signed IPA."
              exit 1
            }
            signed_arg+=(--verified-signed)
          fi
          python3 scripts/update-store-source.py \
            "${signed_arg[@]}" \
            --source store.json \
            --ipa "source-assets/${ipa_name}" \
            --release-notes "${release_notes}" \
            --release-version "${RELEASE_VERSION#v}" \
            --release-date "${release_date}" \
            --download-url "${download_url}" \
            --icon-url "${icon_url}"

      - name: Verify the source only advertises downloadable assets
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # store.json is what AltStore follows, so every URL it publishes has to
          # resolve right now. This also catches a typo in the download URL or a
          # download URL that github.com has already stopped serving.
          failed=0
          while IFS= read -r url; do
            [[ -z "${url}" || "${url}" == "null" ]] && continue
            # A one-byte range request keeps the check cheap for a 70 MB IPA while
            # still proving that github.com serves the asset right now.
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 --retry 3 --retry-delay 2 --max-time 60 "${url}" || echo 000)"
            # A one-byte range request answers 206 Partial Content, not 200, so
            # both are reachable. Requiring exactly 200 failed every entry,
            # including all previously published ones.
            if [[ "${code}" == "200" || "${code}" == "206" ]]; then
              echo "store.json asset reachable: ${url}"
            else
              echo "::error::store.json advertises ${url}, which answered HTTP ${code}."
              failed=1
            fi
          done < <(jq -r '.apps[].versions[] | .downloadURL' store.json)
          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

      - name: Commit sideload source
        if: steps.ipa.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- store.json)" ]]; then
            echo "store.json is already current for ${RELEASE_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.json
          git commit -m "chore(store): publish ${RELEASE_VERSION}"
          if git push origin "HEAD:${SOURCE_BRANCH}"; then
            echo "Published store.json for ${RELEASE_VERSION} directly to ${SOURCE_BRANCH}."
            exit 0
          fi

          # The source branch is protected by a pull-request ruleset (the
          # `main-protection` ruleset added on 2026-11-06 rejected the v0.1.16
          # direct push). Deliver the very same verified commit through the
          # normal pull-request process instead of bypassing the ruleset. The
          # branch name is derived from the exact release tag so a rerun for the
          # same release lands on the same pull request.
          pr_branch="store/${RELEASE_TAG}"
          echo "::warning::Direct push to ${SOURCE_BRANCH} was rejected; opening a pull request from ${pr_branch} instead."
          if ! git push origin "HEAD:refs/heads/${pr_branch}"; then
            echo "::error::Could not push ${pr_branch}. If a stale ${pr_branch} exists from an earlier run, review and remove it, then rerun this workflow for ${RELEASE_TAG}."
            exit 1
          fi
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${pr_branch}" --base "${SOURCE_BRANCH}" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "::notice::Pull request #${existing} for ${pr_branch} is already open; it now carries the refreshed commit."
            exit 0
          fi
          pr_body="$(printf '%s\n\n%s %s' \
            "Automated sideload-source update for the published release \`${RELEASE_TAG}\`." \
            "The IPA was downloaded from the release, its size and SHA-256 digest were verified against the release metadata, and every advertised download URL was checked before this entry was written." \
            "\`${SOURCE_BRANCH}\` requires pull requests, so the workflow could not push the commit directly; merge this pull request to serve the new entry from \`raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_BRANCH}/store.json\`.")"
          if pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
              --head "${pr_branch}" --base "${SOURCE_BRANCH}" \
              --title "chore(store): publish ${RELEASE_VERSION}" \
              --body "${pr_body}")"; then
            echo "::notice::store.json for ${RELEASE_VERSION} is waiting in ${pr_url}; merge it to publish the sideload source."
            exit 0
          fi
          # GITHUB_TOKEN may not open pull requests unless the repository allows
          # "GitHub Actions to create and approve pull requests" (this is what
          # happened for v0.1.16). The verified commit is already on the branch,
          # so a maintainer only has to open and merge the pull request.
          echo "::error::The verified store.json commit is on ${pr_branch}, but this token could not open the pull request. Open it with: gh pr create --repo ${GITHUB_REPOSITORY} --head ${pr_branch} --base ${SOURCE_BRANCH} --title 'chore(store): publish ${RELEASE_VERSION}' (or allow GitHub Actions to create pull requests in the repository settings), then merge it."
          exit 1
