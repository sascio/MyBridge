name: iOS simulator Kotlin tests

# Run the simulator Kotlin tests without rebuilding or uploading an IPA.
# On failure, put the Gradle diagnostics in the job summary and annotations so
# the cause stays visible even if raw Actions logs are temporarily unavailable.
on:
  workflow_call:
    inputs:
      cache_read_only:
        description: Restore shared caches without writing from this job
        required: false
        default: true
        type: boolean
      use_prepared_dependencies:
        description: Restore the caller workflow's shared iOS dependency artifact
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      cache_read_only:
        description: Restore shared caches without writing from this run
        required: false
        default: false
        type: boolean
      use_prepared_dependencies:
        description: Restore the caller workflow's shared iOS dependency artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    name: iOS simulator Kotlin tests
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx8192M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx12288M
      NUVIO_GRADLE_JVMARGS: -Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact release source commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ inputs.cache_read_only }}

      - name: Verify Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          version_output="$(xcodebuild -version)"
          xcode_version="${version_output%%$'\n'*}"
          xcode_version="${xcode_version// /}"
          xcode_version="${xcode_version//:/-}"
          echo "xcode_version=${xcode_version}" >> "${GITHUB_OUTPUT}"

      - name: Restore Kotlin/Native toolchain cache
        id: konan_restore
        if: ${{ inputs.cache_read_only }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.konan
          # Never restore native compiler outputs from a different Xcode or Kotlin toolchain.
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache Kotlin/Native toolchain
        id: konan_cache
        if: ${{ !inputs.cache_read_only }}
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Report runner and cache baseline
        env:
          KONAN_CACHE_HIT: ${{ inputs.cache_read_only && steps.konan_restore.outputs.cache-hit || steps.konan_cache.outputs.cache-hit }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cpu="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
          cpus="$(sysctl -n hw.ncpu 2>/dev/null || echo unknown)"
          memory_bytes="$(sysctl -n hw.memsize 2>/dev/null || echo 0)"
          memory_gib="$(awk -v bytes="${memory_bytes}" 'BEGIN { if (bytes > 0) printf "%.1f GiB", bytes/1073741824; else print "unknown" }')"
          if [ "${KONAN_CACHE_HIT}" = "true" ]; then cache_status=exact-hit; else cache_status=miss; fi
          {
            echo "## iOS simulator runner and cache"
            echo
            echo "- UTC start: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}; ${cpu}; ${cpus} logical CPUs; ${memory_gib} RAM"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Kotlin/Native cache: ${cache_status}"
            echo "- Free disk: $(df -h . | awk 'NR==2 {print $4}')"
            echo "- Gradle configuration/build cache: $(grep -E '^org.gradle.(configuration-cache|caching)=' gradle.properties | tr '\n' ', ' )"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Configure runtime properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 is not set; using empty runtime properties."
            exit 0
          fi
          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          echo "Runtime properties configured."

      - name: Download shared iOS dependencies
        if: ${{ inputs.use_prepared_dependencies }}
        uses: actions/download-artifact@v8
        with:
          name: streambridge-ios-dependencies
          path: ${{ runner.temp }}/streambridge-ios-dependencies

      - name: Restore and verify shared iOS dependencies
        if: ${{ inputs.use_prepared_dependencies }}
        run: |
          set -euo pipefail
          extracted="${RUNNER_TEMP}/streambridge-ios-dependencies/extracted"
          mkdir -p "${extracted}"
          tar -xzf "${RUNNER_TEMP}/streambridge-ios-dependencies/streambridge-ios-dependencies.tar.gz" \
            -C "${extracted}"
          ditto "${extracted}/MPVKit" "${GITHUB_WORKSPACE}/MPVKit"
          mkdir -p "${GITHUB_WORKSPACE}/../nuvio-engine/platform/apple"
          ditto "${extracted}/nuvio-engine/platform/apple/NuvioEngine.xcframework" \
            "${GITHUB_WORKSPACE}/../nuvio-engine/platform/apple/NuvioEngine.xcframework"
          ./scripts/prepare-ios-dependencies.sh

      - name: Prepare iOS dependencies independently
        if: ${{ !inputs.use_prepared_dependencies }}
        run: ./scripts/prepare-ios-dependencies.sh

      # Match the iOS memory profile applied by build-ios-ipa.sh, without
      # invoking its IPA build or any signing/package steps.
      - name: Configure iOS Gradle memory profile
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          properties_file="${gradle_user_home}/gradle.properties"
          touch "${properties_file}"
          marker="# StreamBridge iOS memory profile (scripts/build-ios-ipa.sh)"
          if ! grep -qF "${marker}" "${properties_file}"; then
            {
              echo ""
              echo "${marker}"
              echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
              echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
              echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            } >> "${properties_file}"
          fi

      - name: Run iOS simulator Kotlin tests
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -uo pipefail
          test_log="${RUNNER_TEMP}/ios-simulator-arm64-test.log"
          set +e
          ./gradlew --profile :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee "${test_log}"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "${status}" -ne 0 ]; then
            python3 - "${test_log}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = text.splitlines()
          marker = re.compile(r"(?i)(FAILURE:|what went wrong|execution failed|e: file:|error:|exception|caused by:|no tests found|test failed|could not|failed to|unavailable)")
          indices = [i for i, line in enumerate(lines) if marker.search(line)]
          selected = set()
          for i in indices[-20:]:
              selected.update(range(max(0, i - 4), min(len(lines), i + 9)))
          if not selected:
              selected.update(range(max(0, len(lines) - 100), len(lines)))
          excerpt = "\n".join(f"{i + 1}: {lines[i]}" for i in sorted(selected))
          excerpt = excerpt[-12000:]
          with pathlib.Path(sys.argv[2]).open("a") as out:
              out.write("\n## Failed iOS simulator test diagnostics\n\n```text\n")
              out.write(excerpt)
              out.write("\n```\n")
          encoded = excerpt[-9000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle simulator test diagnostics::{encoded}")
          PY
          fi
          exit "${status}"

      - name: Upload simulator-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iOS-simulator-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-simulator-arm64-test.log
            composeApp/build/test-results/iosSimulatorArm64Test/**
            composeApp/build/reports/tests/iosSimulatorArm64Test/**
            build/reports/profile/**
            composeApp/build/reports/profile/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Report simulator job completion
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo
            echo "### Simulator-test job completion"
            echo
            echo "- UTC completion: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Result: ${JOB_RESULT}"
            echo "- Memory pressure: $(memory_pressure 2>/dev/null | head -n 1 || echo unavailable)"
            echo "- Free disk: $(df -h . | awk 'NR==2 {print $4}')"
            echo "- VM paging counters:"
            vm_stat | grep -E 'Pages (free|active|inactive|speculative|wired down|occupied by compressor)|Pageins|Pageouts' || true
          } >> "${GITHUB_STEP_SUMMARY}"
