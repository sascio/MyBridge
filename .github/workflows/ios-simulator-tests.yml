name: iOS simulator Kotlin tests

# Target the simulator test task without rebuilding or uploading an IPA.
# Failure details are mirrored to the job summary and annotations so they remain
# inspectable even when Actions raw-log downloads are unavailable to a client.
on:
  push:
    branches: [main, arena/**]
    paths:
      - ".github/workflows/ios-simulator-tests.yml"
      - "composeApp/build.gradle.kts"
      - "composeApp/src/commonMain/**"
      - "composeApp/src/commonTest/**"
      - "composeApp/src/iosMain/**"
      - "composeApp/src/iosTest/**"
      - "composeApp/src/iosAppStore/**"
      - "composeApp/src/iosFull/**"
      - "composeApp/src/fullCommonMain/**"
      - "gradle/**"
      - "gradle.properties"
      - "scripts/prepare-ios-dependencies.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    name: iOS simulator Kotlin tests
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx8192M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx12288M
      NUVIO_GRADLE_JVMARGS: -Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The original run's logs and build-log artifact are captured from the
      # runner (which can access GitHub's Actions result storage) for diagnosis.
      # Retrieval is best-effort; the focused test below remains authoritative.
      - name: Retrieve original failed-run logs and build-log artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          source_run=43611314892
          source_job=132496868813
          source_artifact=14121784220
          output_dir="${RUNNER_TEMP}/original-ios-failure"
          mkdir -p "${output_dir}"
          if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${source_job}/logs" \
            > "${output_dir}/original-job.log" 2> "${output_dir}/job-log-fetch.err"; then
            echo "Original job log retrieved."
            python3 - "${output_dir}/original-job.log" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          summary = pathlib.Path(sys.argv[2])
          needles = ("Run iOS simulator Kotlin tests", "iosSimulatorArm64Test", "FAILURE:", "What went wrong")
          matches = [i for i, line in enumerate(source) if any(n in line for n in needles)]
          if matches:
              lo = max(0, matches[0] - 8)
              hi = min(len(source), matches[-1] + 100)
              excerpt = "\n".join(source[lo:hi])
              with summary.open("a") as out:
                  out.write("\n## Original run simulator-test log excerpt\n\n```text\n")
                  out.write(excerpt[-18000:])
                  out.write("\n```\n")
              encoded = excerpt[-8000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Original simulator failure log::{encoded}")
          else:
              with summary.open("a") as out:
                  out.write("\nOriginal raw job log was retrieved, but expected simulator-test markers were not found; see the diagnostic artifact.\n")
          PY
          else
            echo "::warning::Could not retrieve original job logs; see fetch error in the diagnostic artifact."
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_artifact}/zip" \
            > "${output_dir}/original-build-log-artifact.zip" 2> "${output_dir}/artifact-fetch.err"; then
            mkdir -p "${output_dir}/build-log-artifact"
            if unzip -q "${output_dir}/original-build-log-artifact.zip" -d "${output_dir}/build-log-artifact"; then
              echo "Original StreamBridge-iOS-build-log artifact retrieved and extracted."
              python3 - "${output_dir}/build-log-artifact" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, re, sys
          root, summary = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          logs = sorted(root.rglob("*.log"))
          with summary.open("a") as out:
              out.write("\n## Original IPA build-log artifact inspection\n\n")
              if not logs:
                  out.write("The downloaded artifact contained no `.log` file.\n")
              for log in logs:
                  lines = log.read_text(errors="replace").splitlines()
                  matches = [line for line in lines if re.search(r"(?i)(failure:|what went wrong|\berror\b|exception)", line)]
                  excerpt = "\n".join(matches[-60:] if matches else lines[-30:])
                  out.write(f"- `{log.name}`: {log.stat().st_size} bytes; {len(matches)} error/failure marker lines.\n\n```text\n")
                  out.write(excerpt[-8000:])
                  out.write("\n```\n")
                  encoded = excerpt[-5000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=Original IPA build log excerpt::{encoded}")
          PY
            else
              echo "::warning::Original build-log artifact was retrieved but could not be extracted."
            fi
          else
            echo "::warning::Could not retrieve original build-log artifact; see fetch error in the diagnostic artifact."
          fi
          echo "Original failed run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${source_run}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Verify Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          version_output="$(xcodebuild -version)"
          xcode_version="${version_output%%$'\n'*}"
          xcode_version="${xcode_version// /}"
          xcode_version="${xcode_version//:/-}"
          echo "xcode_version=${xcode_version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure runtime properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 is not set; using empty runtime properties."
            exit 0
          fi
          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          echo "Runtime properties configured."

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      # Match the iOS memory profile applied by build-ios-ipa.sh in the release
      # workflow, without invoking the IPA build or its signing/package steps.
      - name: Configure iOS Gradle memory profile
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          properties_file="${gradle_user_home}/gradle.properties"
          touch "${properties_file}"
          marker="# StreamBridge iOS memory profile (scripts/build-ios-ipa.sh)"
          if ! grep -qF "${marker}" "${properties_file}"; then
            {
              echo ""
              echo "${marker}"
              echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
              echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
              echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            } >> "${properties_file}"
          fi
          ./gradlew --stop >/dev/null 2>&1 || true

      - name: Run iOS simulator Kotlin tests
        id: simulator-tests
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -uo pipefail
          test_log="${RUNNER_TEMP}/ios-simulator-arm64-test.log"
          ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee "${test_log}"
          status="${PIPESTATUS[0]}"
          if [ "${status}" -ne 0 ]; then
            python3 - "${test_log}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          excerpt = "\n".join(text.splitlines()[-120:])
          with pathlib.Path(sys.argv[2]).open("a") as out:
              out.write("\n## Failed iOS simulator test output (last 120 lines)\n\n```text\n")
              out.write(excerpt[-18000:])
              out.write("\n```\n")
          encoded = excerpt[-10000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle simulator test output::{encoded}")
          PY
          fi
          exit "${status}"

      - name: Upload simulator-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iOS-simulator-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-simulator-arm64-test.log
            ${{ runner.temp }}/original-ios-failure/**
            composeApp/build/test-results/iosSimulatorArm64Test/**
            composeApp/build/reports/tests/iosSimulatorArm64Test/**
          if-no-files-found: ignore
          retention-days: 14
