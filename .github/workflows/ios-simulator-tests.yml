name: iOS simulator Kotlin tests

# Run the simulator Kotlin tests without rebuilding or uploading an IPA.
# On failure, put the Gradle diagnostics in the job summary and annotations so
# the cause stays visible even if raw Actions logs are temporarily unavailable.
on:
  push:
    branches: [main, arena/**]
    paths:
      - ".github/workflows/ios-simulator-tests.yml"
      - "composeApp/build.gradle.kts"
      - "composeApp/src/commonMain/**"
      - "composeApp/src/commonTest/**"
      - "composeApp/src/iosMain/**"
      - "composeApp/src/iosTest/**"
      - "composeApp/src/iosAppStore/**"
      - "composeApp/src/iosFull/**"
      - "composeApp/src/fullCommonMain/**"
      - "gradle/**"
      - "gradle.properties"
      - "scripts/prepare-ios-dependencies.sh"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    name: iOS simulator Kotlin tests
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx8192M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx12288M
      NUVIO_GRADLE_JVMARGS: -Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Re-parse the previous failed run's uploaded Gradle log and test reports
      # on a GitHub runner, since the local sandbox cannot reach Actions storage.
      - name: Inspect previous simulator-test diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=14125278095
          diagnostic_dir="${RUNNER_TEMP}/previous-ios-simulator-diagnostics"
          mkdir -p "${diagnostic_dir}/unzipped"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${diagnostic_dir}/artifact.zip"
          unzip -q "${diagnostic_dir}/artifact.zip" -d "${diagnostic_dir}/unzipped"
          python3 - "${diagnostic_dir}/unzipped" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          root, summary = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          sections = []
          logs = list(root.rglob("ios-simulator-arm64-test.log"))
          marker = re.compile(r"(?i)(^e: file:|^FAILURE:|^what went wrong|> task .*failed|execution failed for task|there were failing tests|test run failed|assertionerror|caused by:|exception in thread)")
          for log in logs:
              lines = log.read_text(errors="replace").splitlines()
              indices = [i for i, line in enumerate(lines) if marker.search(line)]
              selected = set(range(max(0, len(lines) - 100), len(lines)))
              for i in indices:
                  selected.update(range(max(0, i - 5), min(len(lines), i + 12)))
              excerpt = "\n".join(f"{i + 1}: {lines[i]}" for i in sorted(selected))
              sections.append(f"## {log.name}: {len(lines)} lines\n{excerpt[-14000:]}")
          xml_files = list(root.rglob("*.xml"))
          test_failures = []
          for xml_file in xml_files:
              try:
                  tree = ET.parse(xml_file)
              except ET.ParseError:
                  continue
              for case in tree.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      test_failures.append(
                          f"{case.get('classname')}.{case.get('name')}: "
                          f"{failure.get('type', '')} {failure.get('message', '')}\n{failure.text or ''}"
                      )
          sections.append(f"## Test result XML files: {len(xml_files)}; failing cases: {len(test_failures)}")
          sections.extend(test_failures)
          report = "\n\n".join(sections) or "No simulator log or XML report was found in the artifact."
          with summary.open("a") as out:
              out.write("\n## Previous failed iOS simulator run diagnostics\n\n```text\n")
              out.write(report[-20000:])
              out.write("\n```\n")
          encoded = report[-14000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Previous iOS simulator failure details::{encoded}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Verify Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          version_output="$(xcodebuild -version)"
          xcode_version="${version_output%%$'\n'*}"
          xcode_version="${xcode_version// /}"
          xcode_version="${xcode_version//:/-}"
          echo "xcode_version=${xcode_version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure runtime properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 is not set; using empty runtime properties."
            exit 0
          fi
          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          echo "Runtime properties configured."

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      # Match the iOS memory profile applied by build-ios-ipa.sh, without
      # invoking its IPA build or any signing/package steps.
      - name: Configure iOS Gradle memory profile
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          properties_file="${gradle_user_home}/gradle.properties"
          touch "${properties_file}"
          marker="# StreamBridge iOS memory profile (scripts/build-ios-ipa.sh)"
          if ! grep -qF "${marker}" "${properties_file}"; then
            {
              echo ""
              echo "${marker}"
              echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
              echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
              echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            } >> "${properties_file}"
          fi
          ./gradlew --stop >/dev/null 2>&1 || true

      - name: Run iOS simulator Kotlin tests
        env:
          NUVIO_IOS_DISTRIBUTION: full
        run: |
          set -uo pipefail
          test_log="${RUNNER_TEMP}/ios-simulator-arm64-test.log"
          set +e
          ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee "${test_log}"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "${status}" -ne 0 ]; then
            python3 - "${test_log}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = text.splitlines()
          marker = re.compile(r"(?i)(FAILURE:|what went wrong|execution failed|e: file:|error:|exception|caused by:|no tests found|test failed|could not|failed to|unavailable)")
          indices = [i for i, line in enumerate(lines) if marker.search(line)]
          selected = set()
          for i in indices[-20:]:
              selected.update(range(max(0, i - 4), min(len(lines), i + 9)))
          if not selected:
              selected.update(range(max(0, len(lines) - 100), len(lines)))
          excerpt = "\n".join(f"{i + 1}: {lines[i]}" for i in sorted(selected))
          excerpt = excerpt[-12000:]
          with pathlib.Path(sys.argv[2]).open("a") as out:
              out.write("\n## Failed iOS simulator test diagnostics\n\n```text\n")
              out.write(excerpt)
              out.write("\n```\n")
          encoded = excerpt[-9000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle simulator test diagnostics::{encoded}")
          PY
          fi
          exit "${status}"

      - name: Upload simulator-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iOS-simulator-test-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-simulator-arm64-test.log
            composeApp/build/test-results/iosSimulatorArm64Test/**
            composeApp/build/reports/tests/iosSimulatorArm64Test/**
          if-no-files-found: ignore
          retention-days: 14
