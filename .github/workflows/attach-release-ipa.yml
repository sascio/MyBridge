name: Attach release IPA

# Ops helper: attaches a built unsigned IPA (from a completed ios-release run)
# to a draft release, verifying the bundle before upload. The sandbox that runs
# the agent cannot reach GitHub's artifact blob storage, so this runs where the
# bytes are. Every check is fail-closed: wrong bundle id, wrong version, a
# provisioning profile (signed IPA), or a digest mismatch aborts the run.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id that produced the StreamBridge-iOS-unsigned-IPA artifact
        required: true
        type: string
      release_id:
        description: Draft release id to attach the IPA to
        required: true
        type: string
      asset_name:
        description: Release asset name (must match the release notes)
        required: true
        type: string
      expected_version:
        description: Expected CFBundleShortVersionString
        required: true
        type: string
      expected_code:
        description: Expected CFBundleVersion
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: attach-release-ipa-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  attach:
    name: Verify and attach the unsigned IPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the IPA artifact from the build run
        uses: actions/download-artifact@v7
        with:
          name: StreamBridge-iOS-unsigned-IPA
          path: ipa
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Identify exactly one IPA
        run: |
          set -euo pipefail
          count="$(find ipa -maxdepth 1 -type f -name '*.ipa' | wc -l)"
          echo "IPA files found: ${count}"
          [[ "${count}" == "1" ]] || { echo "::error::Expected exactly one IPA in the artifact"; exit 1; }
          ipa="$(find ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          echo "IPA_PATH=${ipa}" >> "${GITHUB_ENV}"

      - name: Verify the bundle is StreamBridge, the right version, and unsigned
        shell: python3 {0}
        run: |
          import os, plistlib, sys, zipfile
          ipa = os.environ["IPA_PATH"]
          names = zipfile.ZipFile(ipa).namelist()
          app = next(n.split("/")[1] for n in names if n.startswith("Payload/") and n.rstrip("/").count("/") == 1)
          print(f"App bundle: {app}")
          with zipfile.ZipFile(ipa) as z:
              info = plistlib.loads(z.read(f"Payload/{app}/Info.plist"))
          bundle_id = info["CFBundleIdentifier"]
          version = info["CFBundleShortVersionString"]
          code = str(info["CFBundleVersion"])
          print(f"bundle={bundle_id} version={version} code={code}")
          if bundle_id != "com.streambridge.app":
              sys.exit("::error::Wrong bundle id " + bundle_id)
          if version != "${{ inputs.expected_version }}":
              sys.exit("::error::Wrong version " + version)
          if code != "${{ inputs.expected_code }}":
              sys.exit("::error::Wrong build " + code)
          if any(n.lower().endswith("embedded.mobileprovision") for n in names):
              sys.exit("::error::The IPA carries a provisioning profile; the release IPA must be unsigned")
          print("The IPA is unsigned as designed (AltStore/SideStore re-sign).")

      - name: Attach to the draft release and cross-check the stored digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_sha="$(sha256sum "${IPA_PATH}" | awk '{print $1}')"
          echo "Local SHA-256: ${local_sha}"
          if ! list_out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ inputs.release_id }}/assets" 2>&1)"; then
            echo "::error::asset list failed: $(printf '%s' "${list_out}" | head -c 2500 | tr '\n' ' ')"
            exit 1
          fi
          existing="$(printf '%s' "${list_out}" | jq -r --arg n "${{ inputs.asset_name }}" '.[] | select(.name == $n) | .id')"
          if [[ -n "${existing}" ]]; then
            echo "Deleting existing asset ${existing} of the draft (by id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing}"
          fi
          if ! upload_out="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/${{ inputs.release_id }}/assets?name=${{ inputs.asset_name }}" \
            -H "Content-Type: application/octet-stream" \
            --input "${IPA_PATH}" 2>&1)"; then
            echo "gh api failed; retrying with curl"
            gh_api_message="$(printf '%s' "${upload_out}" | jq -r '.message // empty' | head -c 800)"
            echo "gh api said: ${gh_api_message}"
            if ! curl -sf -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Length: $(stat -c%s "${IPA_PATH}")" \
              --data-binary "@${IPA_PATH}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ inputs.release_id }}/assets?name=${{ inputs.asset_name }}" \
              -o asset.json -w "curl http %{http_code}\n"; then
              echo "::error::both gh api and curl uploads failed; gh api said: ${gh_api_message}"
              exit 1
            fi
          fi
          asset_id="$(jq -r .id asset.json)"
          echo "Uploaded asset id ${asset_id}"
          stored_sha="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" --jq '.digest' | sed 's|^sha256:||')"
          size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" --jq '.size')"
          echo "Stored asset ${asset_id}: ${size} bytes, SHA-256 ${stored_sha}"
          [[ "${stored_sha}" == "${local_sha}" ]] || { echo "::error::Stored digest differs from the local file"; exit 1; }
          echo "Attached and verified: ${{ inputs.asset_name }}"
