name: Check tracking secrets

# Read-only diagnostic for the Trakt/Simkl/MDBList credentials that the Android
# and iOS release builds take from NUVIO_LOCAL_PROPERTIES_BASE64.
#
# It decodes the stored secret exactly the way release-draft.yml does and reports
# which property NAMES it contains. Credential values are never printed, never
# uploaded and never written outside the runner. Nothing is built and no release
# is touched, so this finishes in seconds and can be run as often as you like.
#
# Run it from the Actions tab (workflow_dispatch) when you want to confirm the
# secret is present and complete before starting a release build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Decode NUVIO_LOCAL_PROPERTIES_BASE64 (presence only)
    runs-on: ubuntu-latest

    steps:
      - name: Report which tracking properties the secret provides
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          property_present() {
            grep -Eq "^[[:space:]]*$1[[:space:]]*=[[:space:]]*\\S" local.properties
          }

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" ]; then
            echo "::error::The repository secret NUVIO_LOCAL_PROPERTIES_BASE64 does not exist (or is empty). Every release build will ship with Trakt, Simkl and MDBList unconfigured. See docs/TRAKT-SIMKL-CONFIG.md."
            : > local.properties
          else
            echo "Secret NUVIO_LOCAL_PROPERTIES_BASE64 exists."
            decoded="$(mktemp)"
            if ! printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" | base64 --decode > "${decoded}" 2>/dev/null; then
              rm -f "${decoded}"
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 exists but is not valid base64. Recreate it with: base64 -w0 local.properties"
              exit 1
            fi
            mv "${decoded}" local.properties

            if ! grep -Eq '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties; then
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 decodes to something that is not a .properties file (no KEY=value lines). Encode the properties file itself."
              exit 1
            fi

            echo "Property names found in the decoded file (names only, values are never printed):"
            grep -E '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties \
              | sed -E 's/^[[:space:]]*([A-Za-z0-9_.-]+)[[:space:]]*=.*$/\1/' \
              | sort -u
          fi

          echo
          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if property_present "${property_name}"; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
              echo "::warning::${property_name} is not set, so that provider will be unconfigured in every build."
            fi
          done

          {
            echo "### Tracking credentials"
            echo
            echo "| Property | Present in secret |"
            echo "| --- | --- |"
            for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
              if property_present "${property_name}"; then
                echo "| \`${property_name}\` | yes |"
              else
                echo "| \`${property_name}\` | **no** |"
              fi
            done
            echo
            echo "Values are never printed. To fix a missing key, update the"
            echo "\`NUVIO_LOCAL_PROPERTIES_BASE64\` secret (Settings → Secrets and"
            echo "variables → Actions) with the whole properties file, not just the"
            echo "missing line. See \`docs/TRAKT-SIMKL-CONFIG.md\`."
          } >> "${GITHUB_STEP_SUMMARY}"

          if ! property_present TRAKT_CLIENT_ID || ! property_present TRAKT_CLIENT_SECRET; then
            echo "::error::Trakt needs BOTH TRAKT_CLIENT_ID and TRAKT_CLIENT_SECRET. Without them the app shows \"Missing TRAKT_CLIENT_ID / TRAKT_CLIENT_SECRET\" and the Connect button stays disabled."
            exit 1
          fi

          echo "Trakt credentials are present in NUVIO_LOCAL_PROPERTIES_BASE64."
