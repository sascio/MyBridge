name: Draft production GitHub Release

# Manual only, or from a v* tag push. Never publishes (draft only).
#
# Android: fails closed unless the production upload-keystore GitHub Secrets are
# set. Debug-signed APKs are never attached. See docs/SIGNING.md.
#
# iOS: builds the StreamBridge IPA on a macOS runner, unsigned, and attaches it
# to the draft. The unsigned IPA is the iOS distribution artifact: AltStore and
# SideStore re-sign it with the installer's own Apple ID, which is why no Apple
# Developer credentials are required or used here. The build fails if the
# application unexpectedly comes out signed. See docs/RELEASE-IOS.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching STREAMBRIDGE_VERSION_NAME (e.g. v0.1.09)
        required: true
        type: string
        default: "v0.1.09"
      include_ios:
        description: Also build the iOS release IPA
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Two runs for the same tag could otherwise race while creating the tag and the
# draft release. In-flight releases are never cancelled: the tag push and the
# asset upload must finish.
concurrency:
  group: streambridge-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Production-signed full APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Require production signing secrets
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in NUVIO_RELEASE_STORE_BASE64 NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var GitHub secret is not set. Production release cannot proceed. See docs/SIGNING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify tag matches StreamBridge version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f streambridge.version.properties ]; then
            echo "::error::streambridge.version.properties is missing on the checked-out tree."
            exit 1
          fi
          version_name="$(grep '^STREAMBRIDGE_VERSION_NAME=' streambridge.version.properties | cut -d= -f2 | tr -d '\r')"
          tag="${TAG#v}"
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Release tag must match STREAMBRIDGE_VERSION_NAME ($version_name). Got $TAG."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$NUVIO_RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks"

      # Official NuvioMobile credential-supply mechanism, reproduced from
      # NuvioMedia/NuvioMobile .github/workflows/android-release.yml ("Configure
      # release properties"). :composeApp generateRuntimeConfigs reads the
      # Trakt/Simkl keys out of local.properties only, so CI has to materialise that
      # file before Gradle runs. Nothing is echoed: base64 -d writes straight to the
      # file and the checks only test for presence.
      #
      # NUVIO_LOCAL_PROPERTIES_BASE64 is optional. Tracking is not configured for
      # every release, so when the secret is absent CI creates an empty
      # local.properties and the build proceeds with unconfigured Trakt/Simkl/MDBList
      # (empty generated credentials, and Settings shows the missing-credentials
      # state for each provider). No placeholder credentials are ever injected.
      - name: Configure release properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 not set; using empty local.properties (Trakt/Simkl unconfigured for this build)."
            exit 0
          fi

          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          # sdk.dir is runner-specific and the keystore is decoded separately above,
          # so drop any copies carried inside the secret (official does the same).
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

          # Tracking properties are optional: a missing TRAKT_CLIENT_ID,
          # TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID or MDBLIST_CLIENT_ID must not fail
          # the release. Presence-only report; values are never printed.
          #
          # MDBLIST_CLIENT_ID is included because MdbListConfig.CLIENT_ID gates the
          # MDBList Connect button: without it the app shows "MDBList connection is
          # unavailable in this build." and there is no way to connect. MDBList is a
          # public OAuth device-flow client, so the client id is its only credential
          # -- there is deliberately no MDBLIST_CLIENT_SECRET.
          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*\\S" local.properties; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
            fi
          done

          echo "local.properties configured."

      - name: Assemble production full release
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/upload.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STREAMBRIDGE_REQUIRE_PRODUCTION_SIGNING: "true"
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Trakt/Simkl are deliberately NOT passed as environment variables. They are
          # supplied through the decoded local.properties above, which is the official
          # NuvioMobile mechanism and the only credential path this build supports
          # (composeApp/build.gradle.kts resolves them with runtimeLocalPropertyValue).
          #
          # MDBList is different: build.gradle.kts resolves MDBLIST_CLIENT_ID with
          # runtimeConfigValue(), the same helper as TMDB_API_KEY above, which accepts
          # the environment. So it can be supplied either inside
          # NUVIO_LOCAL_PROPERTIES_BASE64 (preferred, matches upstream) or as its own
          # secret. local.properties wins when both are set. When the secret is unset
          # GitHub passes an empty string, which normalisation treats as "not
          # configured" -- identical to today's behaviour, so this is additive.
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      # Presence-only report of what reached the generated runtime config
      # (local.properties -> generateRuntimeConfigs -> TraktConfig/SimklConfig/MdbListConfig).
      # Tracking credentials are optional, so empty generated values must not fail
      # the release. Greps the generated Kotlin for an empty literal; never prints a
      # value. Each line is prefixed with its provider because all three constants
      # are named CLIENT_ID and would otherwise be indistinguishable in the log.
      - name: Report generated tracking config presence
        run: |
          set -euo pipefail
          generated="composeApp/build/generated/runtime-config/kotlin"
          trakt="$generated/com/nuvio/app/features/trakt/TraktConfig.kt"
          simkl="$generated/com/nuvio/app/features/simkl/SimklConfig.kt"
          mdblist="$generated/com/nuvio/app/features/mdblist/MdbListConfig.kt"

          report_populated() {
            local provider="$1" file="$2" constant="$3"
            if [ ! -f "$file" ]; then
              echo "::warning::Generated config missing: $file"
              return
            fi
            if grep -Eq "const val ${constant} = \"\"" "$file"; then
              echo "${provider} ${constant} present=false"
            else
              echo "${provider} ${constant} present=true"
            fi
          }

          report_populated TRAKT "$trakt" CLIENT_ID
          report_populated TRAKT "$trakt" CLIENT_SECRET
          report_populated SIMKL "$simkl" CLIENT_ID
          report_populated MDBLIST "$mdblist" CLIENT_ID

      - name: Reject debug certificates and record public cert identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full/release APKs were produced."
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools. Cannot verify production signature."
            exit 1
          fi
          expected_sha256="5da621d8e6f5c4ffb7396de3fbf686f3bf61bcec71cccffba9bbbbdef56285fc"
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$certs"
            if printf '%s\n' "$certs" | grep -Ei 'CN=Android Debug|Android Debug'; then
              echo "::error::$apk is signed with the Android Debug certificate. Refusing to attach it to a release."
              exit 1
            fi
            got_sha256="$(printf '%s\n' "$certs" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr 'A-F' 'a-f' | tr -d ' :')"
            if [ "$got_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate SHA-256 does not match the StreamBridge production upload certificate."
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | tee checksums.sha256

      - name: Require expected production APKs
        run: |
          set -euo pipefail
          missing=0
          for f in \
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk \
            checksums.sha256
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required production asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload production-signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-production-full-release-apk
          path: |
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            checksums.sha256
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event_name == 'push' || inputs.include_ios }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      # Same memory profile as .github/workflows/ios-release.yml, which is the
      # configuration that builds successfully. The earlier small heaps made
      # :composeApp:linkReleaseFrameworkIosArm64 fail with
      # java.lang.OutOfMemoryError: Java heap space. NUVIO_GRADLE_JVMARGS is
      # deliberately not set: build-ios-ipa.sh applies upstream NuvioMobile's
      # 12288M Gradle daemon heap through GRADLE_USER_HOME for this build only.
      KOTLIN_DAEMON_JVMARGS: -Xmx8192M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx12288M
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      # Parity with the Android job: MDBLIST_CLIENT_ID may also be supplied as its
      # own secret, since runtimeConfigValue() accepts the environment. Empty when
      # unset, which normalisation treats as "not configured".
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Verify Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          # Kotlin/Native's platform libraries are generated from the installed
          # SDK, so the toolchain cache is keyed on the Xcode version as well as
          # the Kotlin version. An Xcode bump therefore re-link rather than reuse
          # libraries built against a different SDK.
          # Parsed in bash rather than through head(1): under `set -o pipefail`
          # a consumer that exits before reading all of xcodebuild's output
          # makes the pipeline report SIGPIPE and fails the step intermittently.
          version_output="$(xcodebuild -version)"
          xcode_version="${version_output%%$'\n'*}"
          xcode_version="${xcode_version// /}"
          xcode_version="${xcode_version//:/-}"
          echo "xcode_version=${xcode_version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-


      - name: Configure runtime properties
        run: |
          set -euo pipefail
          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 not set; using an empty local.properties."
            exit 0
          fi
          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          echo "local.properties configured."

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build StreamBridge IPA
        env:
          # Always unsigned: the published IPA is re-signed by the installer's
          # own Apple ID through AltStore/SideStore. build-ios-ipa.sh fails the
          # build if the application turns out to be signed anyway.
          STREAMBRIDGE_IOS_SIGNING: "0"
        run: ./scripts/build-ios-ipa.sh

      - name: Package IPA for the release
        id: package
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name 'streambridge-*-full-release.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "::error::No StreamBridge IPA was produced."
            exit 1
          fi
          if unzip -l "${ipa_path}" | grep -q '_CodeSignature'; then
            echo "::error::The produced IPA is signed; refusing to publish it."
            exit 1
          fi

          # The release asset name says outright that it is unsigned, so nobody
          # installs it from the release page expecting an App Store build.
          version="$(basename "${ipa_path}" | sed -E 's/^streambridge-(.*)-full-release\.ipa$/\1/')"
          release_ipa="dist/StreamBridge-${version}-iOS-unsigned.ipa"
          mkdir -p dist
          cp "${ipa_path}" "${release_ipa}"
          shasum -a 256 "${release_ipa}" >> checksums-ios.sha256

          {
            echo "## StreamBridge iOS release build"
            echo
            echo "- File: $(basename "${release_ipa}")"
            echo "- Size: $(du -h "${release_ipa}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${release_ipa}" | awk '{print $1}')"
            echo "- Signing: none (unsigned)"
            echo
            echo "> Install with AltStore or SideStore: the unsigned IPA is re-signed with"
            echo "> your own Apple ID at install time. \`store.json\` in this repository is"
            echo "> the sideload source that points at this release asset."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report IPA composition
        run: |
          set -euo pipefail
          ipa_path="$(find dist -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          ipa_bytes="$(stat -c%s "${ipa_path}" 2>/dev/null || stat -f%z "${ipa_path}")"
          {
            echo "### IPA composition ($(basename "${ipa_path}"))"
            echo
            echo "Total size: ${ipa_bytes} bytes"
            echo
            echo "Largest files:"
            echo
            echo '```'
            unzip -l "${ipa_path}" \
              | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); print $1"\t"name}' \
              | sort -k1,1 -rn | awk 'NR<=30'
            echo '```'
            echo
            echo "Size by directory (up to four levels):"
            echo
            echo '```'
            unzip -l "${ipa_path}" \
              | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); if (name=="") next; n=split(name,p,"/"); dir=""; for(i=1;i<=4 && i<n;i++) dir=dir p[i]"/"; sz[dir]+=$1} END {for (d in sz) printf "%12d  %s\n", sz[d], d}' \
              | sort -rn | awk 'NR<=30'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "IPA composition written to the job summary."
          # Annotations stay readable through the GitHub API even when the raw
          # Actions log cannot be downloaded, so the largest components are also
          # emitted as one notice annotation.
          top_components="$(unzip -l "${ipa_path}" \
            | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); if (name=="") next; n=split(name,p,"/"); dir=""; for(i=1;i<=4 && i<n;i++) dir=dir p[i]"/"; sz[dir]+=$1} END {for (d in sz) printf "%d %s\n", sz[d], d}' \
            | sort -rn | awk 'NR<=8 {printf "%s B in %s; ", $1, $2}')"
          echo "::notice title=IPA composition::total ${ipa_bytes} B; ${top_components}"

      - name: Upload StreamBridge iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-ios-unsigned-ipa
          path: |
            dist/*.ipa
          if-no-files-found: error

  draft:
    name: Draft GitHub Release
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download production-signed APKs
        uses: actions/download-artifact@v8
        with:
          name: StreamBridge-production-full-release-apk
          path: release-assets

      - name: Download unsigned iOS IPA
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: StreamBridge-ios-unsigned-ipa
          path: release-assets

      - name: Report iOS artifact status
        run: |
          set -euo pipefail
          if [ "${{ needs.ios.result }}" = "success" ]; then
            echo "Unsigned iOS IPA included in this draft; AltStore/SideStore re-sign it with the installer's Apple ID."
          elif [ "${{ inputs.include_ios }}" = "false" ]; then
            echo "::warning::The iOS build was skipped on request (include_ios=false). This draft has no IPA, so publishing it will not update store.json."
          else
            echo "::error::The iOS job did not produce an IPA. The release carries the iOS artifact, so it is not created without one: store.json can only be built from a release with exactly one .ipa asset."
            exit 1
          fi

      - name: Ensure git tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "Using existing tag ${TAG} -> ${tagged}"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "Created tag ${TAG} -> ${GITHUB_SHA}"
          fi

          # upload-artifact preserves paths relative to the common ancestor of
          # all uploaded files. Since checksums.sha256 is at the repository root,
          # the APKs remain under androidApp/build/outputs/... after download.
          android_assets=(
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            release-assets/checksums.sha256
          )
          for asset in "${android_assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::Missing required production asset: ${asset}"
              exit 1
            fi
          done

          assets=("${android_assets[@]}")
          ipa_assets=(release-assets/*.ipa)
          if [ "${#ipa_assets[@]}" -gt 0 ]; then
            assets+=("${ipa_assets[@]}")
          fi

          notes="$(mktemp)"
          # Written through printf rather than an indented heredoc. A heredoc
          # keeps the YAML indentation, and a release body indented by ten
          # spaces is rendered by GitHub as a code block rather than Markdown.
          release_notes=(
            '## StreamBridge 0.1.09'
            ''
            '### What\'s new'
            '- Fixed Simkl connection authorization.'
            '- Added a new About Us section.'
            '- Added the StreamBridge Telegram community link.'
            '- Updated Settings branding.'
            '- Updated the app to version 0.1.09.'
          )
          printf '%s\n' "${release_notes[@]}" > "$notes"
          ipa_assets=(release-assets/*.ipa)
          if [ "${#ipa_assets[@]}" -gt 0 ]; then
            {
              echo ""
              echo "### iOS installation"
              echo ""
              echo "The iOS build in this release is **unsigned**. Install it with"
              echo "[AltStore](https://altstore.io) or [SideStore](https://sidestore.io):"
              echo "either signs the IPA with your own Apple ID on your device, so no Apple"
              echo "Developer account and no App Store listing is involved."
              echo ""
              echo "Add this repository as a source in AltStore or SideStore to get updates"
              echo "automatically:"
              echo ""
              echo "\`https://raw.githubusercontent.com/sascio/MyBridge/main/store.json\`"
              echo ""
              echo "See \`docs/RELEASE-IOS.md\` for the details."
              echo ""
              echo "The IPA is deliberately unsigned, and no Apple Developer account or"
              echo "App Store submission is involved in this release."
            } >> "$notes"
          else
            {
              echo ""
              echo "### iOS status"
              echo ""
              echo "The iOS build is produced and validated by CI"
              echo "(\`.github/workflows/ios-release.yml\`), but this release carries no IPA."
              echo "\`store.json\` is therefore not updated for this version."
            } >> "$notes"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --title "StreamBridge ${TAG}" --notes-file "$notes" --draft
          else
            gh release create "${TAG}" "${assets[@]}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "StreamBridge ${TAG}" \
              --notes-file "$notes"
          fi

          gh release view "${TAG}" --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'
