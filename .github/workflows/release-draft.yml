name: Draft production GitHub Release

# Manual only, or from a v* tag push. Never publishes (draft only).
#
# Android: fails closed unless the production upload-keystore GitHub Secrets are
# set. Debug-signed APKs are never attached. See docs/SIGNING.md.
#
# iOS: builds the StreamBridge IPA on a macOS runner. The IPA is attached to the
# draft only when Apple signing material is configured; otherwise the run reports
# the missing signing requirement instead of presenting an unsigned IPA as a
# release artifact. See docs/RELEASE-IOS.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching STREAMBRIDGE_VERSION_NAME (e.g. v0.1.08)
        required: true
        type: string
        default: "v0.1.08"
      include_ios:
        description: Also build the iOS release IPA
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Production-signed full APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Require production signing secrets
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in NUVIO_RELEASE_STORE_BASE64 NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var GitHub secret is not set. Production release cannot proceed. See docs/SIGNING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify tag matches StreamBridge version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f streambridge.version.properties ]; then
            echo "::error::streambridge.version.properties is missing on the checked-out tree."
            exit 1
          fi
          version_name="$(grep '^STREAMBRIDGE_VERSION_NAME=' streambridge.version.properties | cut -d= -f2 | tr -d '\r')"
          tag="${TAG#v}"
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Release tag must match STREAMBRIDGE_VERSION_NAME ($version_name). Got $TAG."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$NUVIO_RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks"

      # Official NuvioMobile credential-supply mechanism, reproduced from
      # NuvioMedia/NuvioMobile .github/workflows/android-release.yml ("Configure
      # release properties"). :composeApp generateRuntimeConfigs reads the
      # Trakt/Simkl keys out of local.properties only, so CI has to materialise that
      # file before Gradle runs. Nothing is echoed: base64 -d writes straight to the
      # file and the checks only test for presence.
      #
      # NUVIO_LOCAL_PROPERTIES_BASE64 is optional. Trakt/Simkl are not configured for
      # every release, so when the secret is absent CI creates an empty
      # local.properties and the build proceeds with unconfigured Trakt/Simkl (empty
      # generated credentials). No placeholder credentials are ever injected.
      - name: Configure release properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 not set; using empty local.properties (Trakt/Simkl unconfigured for this build)."
            exit 0
          fi

          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          # sdk.dir is runner-specific and the keystore is decoded separately above,
          # so drop any copies carried inside the secret (official does the same).
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

          # Trakt/Simkl properties are optional: a missing TRAKT_CLIENT_ID,
          # TRAKT_CLIENT_SECRET or SIMKL_CLIENT_ID must not fail the release.
          # Presence-only report; values are never printed.
          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID; do
            if grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*\\S" local.properties; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
            fi
          done

          echo "local.properties configured."

      - name: Assemble production full release
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/upload.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STREAMBRIDGE_REQUIRE_PRODUCTION_SIGNING: "true"
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Trakt/Simkl are deliberately NOT passed as environment variables. They are
          # supplied through the decoded local.properties above, which is the official
          # NuvioMobile mechanism and the only credential path this build supports.
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      # Presence-only report of what reached the generated runtime config
      # (local.properties -> generateRuntimeConfigs -> TraktConfig/SimklConfig).
      # Trakt/Simkl credentials are optional, so empty generated values must not
      # fail the release. Greps the generated Kotlin for an empty literal; never
      # prints a value.
      - name: Report generated Trakt/Simkl config presence
        run: |
          set -euo pipefail
          generated="composeApp/build/generated/runtime-config/kotlin"
          trakt="$generated/com/nuvio/app/features/trakt/TraktConfig.kt"
          simkl="$generated/com/nuvio/app/features/simkl/SimklConfig.kt"

          report_populated() {
            local file="$1" constant="$2"
            if [ ! -f "$file" ]; then
              echo "::warning::Generated config missing: $file"
              return
            fi
            if grep -Eq "const val ${constant} = \"\"" "$file"; then
              echo "${constant} present=false"
            else
              echo "${constant} present=true"
            fi
          }

          report_populated "$trakt" CLIENT_ID
          report_populated "$trakt" CLIENT_SECRET
          report_populated "$simkl" CLIENT_ID

      - name: Reject debug certificates and record public cert identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full/release APKs were produced."
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools. Cannot verify production signature."
            exit 1
          fi
          expected_sha256="5da621d8e6f5c4ffb7396de3fbf686f3bf61bcec71cccffba9bbbbdef56285fc"
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$certs"
            if printf '%s\n' "$certs" | grep -Ei 'CN=Android Debug|Android Debug'; then
              echo "::error::$apk is signed with the Android Debug certificate. Refusing to attach it to a release."
              exit 1
            fi
            got_sha256="$(printf '%s\n' "$certs" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr 'A-F' 'a-f' | tr -d ' :')"
            if [ "$got_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate SHA-256 does not match the StreamBridge production upload certificate."
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | tee checksums.sha256

      - name: Require expected production APKs
        run: |
          set -euo pipefail
          missing=0
          for f in \
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk \
            checksums.sha256
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required production asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload production-signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: StreamBridge-production-full-release-apk
          path: |
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            checksums.sha256
          if-no-files-found: error

  ios:
    name: iOS IPA
    if: ${{ github.event_name == 'push' || inputs.include_ios }}
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          set -euo pipefail
          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 not set; using an empty local.properties."
            exit 0
          fi
          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          echo "local.properties configured."

      - name: Report Apple signing availability
        id: signing
        env:
          TEAM_ID: ${{ secrets.STREAMBRIDGE_IOS_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.STREAMBRIDGE_IOS_SIGN_IDENTITY }}
          CERTIFICATE_BASE64: ${{ secrets.STREAMBRIDGE_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.STREAMBRIDGE_IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.STREAMBRIDGE_IOS_KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.STREAMBRIDGE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${TEAM_ID}" ] || missing+=("STREAMBRIDGE_IOS_TEAM_ID")
          [ -n "${SIGN_IDENTITY}" ] || missing+=("STREAMBRIDGE_IOS_SIGN_IDENTITY")
          [ -n "${CERTIFICATE_BASE64}" ] || missing+=("STREAMBRIDGE_IOS_CERTIFICATE_BASE64")
          [ -n "${CERTIFICATE_PASSWORD}" ] || missing+=("STREAMBRIDGE_IOS_CERTIFICATE_PASSWORD")
          [ -n "${KEYCHAIN_PASSWORD}" ] || missing+=("STREAMBRIDGE_IOS_KEYCHAIN_PASSWORD")
          [ -n "${PROFILE_BASE64}" ] || missing+=("STREAMBRIDGE_IOS_PROFILE_BASE64")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "Apple signing material is configured; the IPA is signed and will be attached to the draft release."
          else
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            printf 'missing_secrets=%s\n' "$(printf '%s, ' "${missing[@]}" | sed 's/, $//')" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple signing is not configured ($(printf '%s, ' "${missing[@]}" | sed 's/, $//')). The iOS build still runs and produces an UNSIGNED IPA for validation, but no IPA is attached to the draft release: an unsigned build is not a distributable iOS release artifact. See docs/RELEASE-IOS.md."
          fi

      - name: Decode provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.STREAMBRIDGE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_path="${RUNNER_TEMP}/streambridge-ios.mobileprovision"
          printf '%s' "${PROFILE_BASE64}" | base64 --decode > "${profile_path}"
          test -s "${profile_path}"
          echo "STREAMBRIDGE_IOS_PROFILE_PATH=${profile_path}" >> "${GITHUB_ENV}"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build StreamBridge IPA
        env:
          STREAMBRIDGE_IOS_SIGNING: ${{ steps.signing.outputs.signed == 'true' && '1' || '0' }}
          STREAMBRIDGE_IOS_TEAM_ID: ${{ secrets.STREAMBRIDGE_IOS_TEAM_ID }}
          STREAMBRIDGE_IOS_SIGN_IDENTITY: ${{ secrets.STREAMBRIDGE_IOS_SIGN_IDENTITY }}
          STREAMBRIDGE_IOS_CERTIFICATE_BASE64: ${{ secrets.STREAMBRIDGE_IOS_CERTIFICATE_BASE64 }}
          STREAMBRIDGE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.STREAMBRIDGE_IOS_CERTIFICATE_PASSWORD }}
          STREAMBRIDGE_IOS_KEYCHAIN_PASSWORD: ${{ secrets.STREAMBRIDGE_IOS_KEYCHAIN_PASSWORD }}
          STREAMBRIDGE_IOS_EXPORT_METHOD: ${{ vars.STREAMBRIDGE_IOS_EXPORT_METHOD || 'app-store' }}
        run: ./scripts/build-ios-ipa.sh

      - name: Package IPA for the release
        id: package
        run: |
          set -euo pipefail
          signed="${{ steps.signing.outputs.signed }}"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name 'streambridge-*-full-release.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "::error::No StreamBridge IPA was produced."
            exit 1
          fi
          shasum -a 256 "${ipa_path}" >> checksums-ios.sha256
          {
            echo "## StreamBridge iOS release build"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Signing: ${signed}"
            if [ "${signed}" != "true" ]; then
              echo
              echo "> This IPA is **unsigned**; it is uploaded for validation only and is"
              echo "> deliberately not attached to the draft GitHub Release."
              echo "> Missing Apple signing secrets: \`${{ steps.signing.outputs.missing_secrets }}\`."
              echo "> See \`docs/RELEASE-IOS.md\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload StreamBridge iOS IPA (validation artifact)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'StreamBridge-production-ios-release-ipa' || 'StreamBridge-ios-UNSIGNED-ipa-not-a-release' }}
          path: |
            build/ios-ipa/*.ipa
          if-no-files-found: error

  draft:
    name: Draft GitHub Release
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download production-signed APKs
        uses: actions/download-artifact@v6
        with:
          name: StreamBridge-production-full-release-apk
          path: release-assets

      - name: Download signed iOS IPA
        if: needs.ios.result == 'success' && needs.ios.outputs.signed == 'true'
        uses: actions/download-artifact@v6
        with:
          name: StreamBridge-production-ios-release-ipa
          path: release-assets

      - name: Report iOS signing status
        run: |
          set -euo pipefail
          if [ "${{ needs.ios.result }}" = "success" ] && [ "${{ needs.ios.outputs.signed }}" = "true" ]; then
            echo "Signed iOS IPA included in this draft."
          else
            echo "::warning::No iOS IPA is attached to this draft. Apple signing material is required to produce a distributable StreamBridge IPA (the iOS build itself is validated by .github/workflows/ios-release.yml). Configure the STREAMBRIDGE_IOS_* secrets documented in docs/RELEASE-IOS.md."
          fi

      - name: Ensure git tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "Using existing tag ${TAG} -> ${tagged}"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "Created tag ${TAG} -> ${GITHUB_SHA}"
          fi

          android_assets=(
            release-assets/androidApp-full-arm64-v8a-release.apk
            release-assets/androidApp-full-armeabi-v7a-release.apk
            release-assets/androidApp-full-x86-release.apk
            release-assets/androidApp-full-x86_64-release.apk
            release-assets/checksums.sha256
          )
          for asset in "${android_assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::Missing required production asset: ${asset}"
              exit 1
            fi
          done

          assets=("${android_assets[@]}")
          ipa_assets=(release-assets/*.ipa)
          if [ "${#ipa_assets[@]}" -gt 0 ]; then
            assets+=("${ipa_assets[@]}")
          fi

          notes="$(mktemp)"
          cat > "$notes" <<'EOF'
          ## StreamBridge 0.1.08

          - Updated core baseline to official NuvioMobile 0.5.5-beta and NuvioMobile-Enhanced 0.5.5-beta.
          - Added in-app ratings synced with Trakt, Simkl and MDBList, plus the ratings sheet and star row on details.
          - Added episode shuffle for series, with its own sheet and per-profile storage.
          - Added subtitle "sync by ear" to align a subtitle track by ear while watching.
          - Plugin runtime: async timers and setTimeout support for Nuvio-compatible plugins.
          - Restyled bottom sheets, dropdown menus and dialogs on the shared UI components.
          - Downloads entry point moved into the library, with an animated downloads icon.
          - Streams screen: shimmer loading states, swipe-to-seek preview and custom landscape posters.
          - Debrid: requested episode file selection and release-aware file selector.
          - MDBList: newest library additions first, response value fixes and rating provider.
          - Profile Insight: cached title facts, background stat computation and manual refresh.
          - Settings: Clear Metadata Cache, always-backdrop landscape cleartext logo option.
          - New locales: Bengali and Urdu, plus Greek, Slovak and Vietnamese updates.
          - iOS: QuickJS 1.0.15, Now Playing audio-session fix, and StreamBridge iOS identity.
          - iOS releases: signed IPA attached when Apple signing secrets are configured.
          - Preserved StreamBridge branding, updater, privacy page, addons, profiles and CloudStream runtime.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --title "StreamBridge ${TAG}" --draft
          else
            gh release create "${TAG}" "${assets[@]}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "StreamBridge ${TAG}" \
              --notes-file "$notes"
          fi

          gh release view "${TAG}" --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'
