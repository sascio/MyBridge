name: Draft production GitHub Release

# Manual only, or from the approved v0.1.13 tag push. Never publishes (draft only).
#
# Android: fails closed unless the production upload-keystore GitHub Secrets are
# set. Debug-signed APKs are never attached. See docs/SIGNING.md.
#
# iOS: builds the StreamBridge IPA on a macOS runner, unsigned, and attaches it
# to the draft. The unsigned IPA is the iOS distribution artifact: AltStore and
# SideStore re-sign it with the installer's own Apple ID, which is why no Apple
# Developer credentials are required or used here. The build fails if the
# application unexpectedly comes out signed. See docs/RELEASE-IOS.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved release tag (v0.1.13, version code 113)
        required: true
        type: string
        default: "v0.1.13"
      include_ios:
        description: Also build the iOS release IPA
        required: false
        type: boolean
        default: true
      require_tracking_credentials:
        description: Fail the build instead of warning when Trakt credentials are missing
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v0.1.13"

permissions:
  contents: write

# Two runs for the same tag could race while creating a draft or uploading
# assets. Do not auto-cancel an in-flight run: each asset is verified by digest,
# and a rerun preserves rather than replaces already attached assets.
concurrency:
  group: streambridge-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Production-signed full APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify approved release target, version, code, and fixes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/verify-release-target.sh \
            --tag "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --verify-tag-ref

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install the CMake the libmpv/libass module needs
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK/cmake/3.22.1" ]; then
            echo "cmake 3.22.1 already installed"
          else
            sdkmanager --install "cmake;3.22.1"
          fi
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Require production signing secrets
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in NUVIO_RELEASE_STORE_BASE64 NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var GitHub secret is not set. Production release cannot proceed. See docs/SIGNING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode upload keystore
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$NUVIO_RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks"

      # Official NuvioMobile credential-supply mechanism, reproduced from
      # NuvioMedia/NuvioMobile .github/workflows/android-release.yml ("Configure
      # release properties"). :composeApp generateRuntimeConfigs reads the
      # Trakt/Simkl keys out of local.properties only, so CI has to materialise that
      # file before Gradle runs. Nothing is echoed: base64 -d writes straight to the
      # file and the checks only test for presence.
      #
      # NUVIO_LOCAL_PROPERTIES_BASE64 is optional. Tracking is not configured for
      # every release, so when the secret is absent CI creates an empty
      # local.properties and the build proceeds with unconfigured Trakt/Simkl/MDBList
      # (empty generated credentials, and Settings shows the missing-credentials
      # state for each provider). No placeholder credentials are ever injected.
      - name: Configure release properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          REQUIRE_TRACKING_CREDENTIALS: ${{ inputs.require_tracking_credentials }}
        run: |
          set -euo pipefail

          # Presence-only helper: booleans and property NAMES are printed, values
          # never are. This output is safe in CI logs and step summaries.
          property_present() {
            grep -Eq "^[[:space:]]*$1[[:space:]]*=[[:space:]]*[^[:space:]]" local.properties
          }

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" ]; then
            # Not a build failure: tracking is optional (see
            # docs/TRAKT-SIMKL-CONFIG.md). It is never a silent success either --
            # the warning and the step summary below say exactly what the APK
            # will be missing.
            : > local.properties
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 is not set. Building with an empty local.properties, so TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID and MDBLIST_CLIENT_ID are all empty and the app will show the missing-credentials state for Trakt, Simkl and MDBList."
          else
            # Decode into a temp file first so a malformed secret can never leave a
            # half-written local.properties behind for Gradle to consume.
            decoded="$(mktemp)"
            if ! printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" | base64 --decode > "${decoded}" 2>/dev/null; then
              rm -f "${decoded}"
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 is set but is not valid base64, so no local.properties can be produced. Recreate it from the properties file with: base64 -w0 local.properties  (macOS: base64 -i local.properties). See docs/TRAKT-SIMKL-CONFIG.md."
              exit 1
            fi
            mv "${decoded}" local.properties

            # sdk.dir is runner-specific and the keystore is decoded separately above,
            # so drop any copies carried inside the secret (official does the same).
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

            # A secret holding something other than a properties file (a raw key, a
            # JSON blob, an APK-style encoded string) would otherwise sail through as
            # "configured" and fail only on the user's device.
            if ! grep -Eq '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties; then
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 decoded successfully but contains no KEY=value lines, so it is not a local.properties file. Encode the properties file itself, not a single value."
              exit 1
            fi

            # Property names only. This proves what the stored secret actually
            # contains without ever revealing a credential value.
            echo "Decoded local.properties defines these properties (names only):"
            grep -E '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties \
              | sed -E 's/^[[:space:]]*([A-Za-z0-9_.-]+)[[:space:]]*=.*$/\1/' \
              | sort -u
          fi

          # Tracking properties are optional: a missing TRAKT_CLIENT_ID,
          # TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID or MDBLIST_CLIENT_ID must not fail
          # the release. Presence-only report; values are never printed.
          #
          # MDBLIST_CLIENT_ID is included because MdbListConfig.CLIENT_ID gates the
          # MDBList Connect button: without it the app shows "MDBList connection is
          # unavailable in this build." and there is no way to connect. MDBList is a
          # public OAuth device-flow client, so the client id is its only credential
          # -- there is deliberately no MDBLIST_CLIENT_SECRET.
          missing=()
          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if property_present "${property_name}"; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
              missing+=("${property_name}")
            fi
          done

          {
            echo "### Tracking credentials in this build"
            echo
            echo "Source: \`NUVIO_LOCAL_PROPERTIES_BASE64\` (presence only, values never printed)."
            echo
            echo "| Property | Present |"
            echo "| --- | --- |"
            for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
              if property_present "${property_name}"; then
                echo "| \`${property_name}\` | yes |"
              else
                echo "| \`${property_name}\` | **no** |"
              fi
            done
            echo
            echo "A missing provider is expected to show its missing-credentials state on device."
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::The decoded local.properties is missing: ${missing[*]}. The APK will show the missing-credentials state for those providers. Update the NUVIO_LOCAL_PROPERTIES_BASE64 secret (see docs/TRAKT-SIMKL-CONFIG.md) before shipping this build."
          fi

          # Opt-in gate for a release that must have working Trakt. Default false so
          # a Simkl/MDBList-only or tracking-free build still succeeds.
          if [ "${REQUIRE_TRACKING_CREDENTIALS:-false}" = "true" ]; then
            gate_failed=0
            for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
              if ! property_present "${property_name}"; then
                echo "::error::${property_name} is missing but require_tracking_credentials=true. Add it to NUVIO_LOCAL_PROPERTIES_BASE64 (docs/TRAKT-SIMKL-CONFIG.md)."
                gate_failed=1
              fi
            done
            if [ "${gate_failed}" -ne 0 ]; then
              exit 1
            fi
          fi

          echo "local.properties configured."

      - name: Assemble production full release
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/upload.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STREAMBRIDGE_REQUIRE_PRODUCTION_SIGNING: "true"
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Trakt/Simkl are deliberately NOT passed as environment variables. They are
          # supplied through the decoded local.properties above, which is the official
          # NuvioMobile mechanism and the only credential path this build supports
          # (composeApp/build.gradle.kts resolves them with runtimeLocalPropertyValue).
          #
          # MDBList is different: build.gradle.kts resolves MDBLIST_CLIENT_ID with
          # runtimeConfigValue(), the same helper as TMDB_API_KEY above, which accepts
          # the environment. So it can be supplied either inside
          # NUVIO_LOCAL_PROPERTIES_BASE64 (preferred, matches upstream) or as its own
          # secret. local.properties wins when both are set. When the secret is unset
          # GitHub passes an empty string, which normalisation treats as "not
          # configured" -- identical to today's behaviour, so this is additive.
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      # Presence-only report of what reached the generated runtime config
      # (local.properties -> generateRuntimeConfigs -> TraktConfig/SimklConfig/MdbListConfig).
      # Tracking credentials are optional, so empty generated values must not fail
      # the release unless the run explicitly asked for them. Greps the generated
      # Kotlin for an empty literal; never prints a value. Each line is prefixed
      # with its provider because all three constants are named CLIENT_ID and would
      # otherwise be indistinguishable in the log.
      - name: Report generated tracking config presence
        env:
          REQUIRE_TRACKING_CREDENTIALS: ${{ inputs.require_tracking_credentials }}
        run: |
          set -euo pipefail
          generated="composeApp/build/generated/runtime-config/kotlin"
          trakt="$generated/com/nuvio/app/features/trakt/TraktConfig.kt"
          simkl="$generated/com/nuvio/app/features/simkl/SimklConfig.kt"
          mdblist="$generated/com/nuvio/app/features/mdblist/MdbListConfig.kt"

          # Returns 0 when the generated constant is non-empty, 1 when it is empty.
          report_populated() {
            local provider="$1" file="$2" constant="$3"
            if [ ! -f "$file" ]; then
              echo "::warning::Generated config missing: $file"
              return 1
            fi
            if grep -Eq "const val ${constant} = \"\"" "$file"; then
              echo "${provider} ${constant} present=false"
              echo "::warning::${provider} is NOT configured in this build: the generated ${constant} is empty, so ${provider} shows its missing-credentials state on device."
              return 1
            fi
            echo "${provider} ${constant} present=true"
            return 0
          }

          trakt_ok=0
          report_populated TRAKT "$trakt" CLIENT_ID || trakt_ok=1
          report_populated TRAKT "$trakt" CLIENT_SECRET || trakt_ok=1
          report_populated SIMKL "$simkl" CLIENT_ID || true
          report_populated MDBLIST "$mdblist" CLIENT_ID || true

          if [ "${trakt_ok}" -ne 0 ] && [ "${REQUIRE_TRACKING_CREDENTIALS:-false}" = "true" ]; then
            echo "::error::This build has no Trakt credentials but require_tracking_credentials=true. Set NUVIO_LOCAL_PROPERTIES_BASE64 before releasing (docs/TRAKT-SIMKL-CONFIG.md)."
            exit 1
          fi

      - name: Reject debug certificates and record public cert identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full/release APKs were produced."
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools. Cannot verify production signature."
            exit 1
          fi
          expected_sha256="5da621d8e6f5c4ffb7396de3fbf686f3bf61bcec71cccffba9bbbbdef56285fc"
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$certs"
            if printf '%s\n' "$certs" | grep -Ei 'CN=Android Debug|Android Debug'; then
              echo "::error::$apk is signed with the Android Debug certificate. Refusing to attach it to a release."
              exit 1
            fi
            got_sha256="$(printf '%s\n' "$certs" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr 'A-F' 'a-f' | tr -d ' :')"
            if [ "$got_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate SHA-256 does not match the StreamBridge production upload certificate."
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | tee checksums.sha256

      - name: Require expected production APKs
        run: |
          set -euo pipefail
          missing=0
          for f in \
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk \
            checksums.sha256
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required production asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload production-signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-production-full-release-apk
          path: |
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            checksums.sha256
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event_name == 'push' || inputs.include_ios }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      # Same memory profile as .github/workflows/ios-release.yml, which is the
      # configuration that builds successfully. The earlier small heaps made
      # :composeApp:linkReleaseFrameworkIosArm64 fail with
      # java.lang.OutOfMemoryError: Java heap space. NUVIO_GRADLE_JVMARGS is
      # deliberately not set: build-ios-ipa.sh applies upstream NuvioMobile's
      # 12288M Gradle daemon heap through GRADLE_USER_HOME for this build only.
      KOTLIN_DAEMON_JVMARGS: -Xmx8192M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx12288M
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      # Parity with the Android job: MDBLIST_CLIENT_ID may also be supplied as its
      # own secret, since runtimeConfigValue() accepts the environment. Empty when
      # unset, which normalisation treats as "not configured".
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Verify Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          # Kotlin/Native's platform libraries are generated from the installed
          # SDK, so the toolchain cache is keyed on the Xcode version as well as
          # the Kotlin version. An Xcode bump therefore re-link rather than reuse
          # libraries built against a different SDK.
          # Parsed in bash rather than through head(1): under `set -o pipefail`
          # a consumer that exits before reading all of xcodebuild's output
          # makes the pipeline report SIGPIPE and fails the step intermittently.
          version_output="$(xcodebuild -version)"
          xcode_version="${version_output%%$'\n'*}"
          xcode_version="${xcode_version// /}"
          xcode_version="${xcode_version//:/-}"
          echo "xcode_version=${xcode_version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-


      - name: Configure runtime properties
        run: |
          set -euo pipefail
          # Same contract as the Android job: decode before Gradle runs, report
          # presence only, never echo a value. See docs/TRAKT-SIMKL-CONFIG.md.
          property_present() {
            grep -Eq "^[[:space:]]*$1[[:space:]]*=[[:space:]]*[^[:space:]]" local.properties
          }

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" ]; then
            : > local.properties
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 is not set. The IPA will be built without Trakt/Simkl/MDBList credentials."
          else
            decoded="$(mktemp)"
            if ! printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64:-}" | base64 --decode > "${decoded}" 2>/dev/null; then
              rm -f "${decoded}"
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 is set but is not valid base64. Recreate it with: base64 -w0 local.properties"
              exit 1
            fi
            mv "${decoded}" local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
            if ! grep -Eq '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties; then
              echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 decoded but contains no KEY=value lines, so it is not a local.properties file."
              exit 1
            fi
            echo "Decoded local.properties defines these properties (names only):"
            grep -E '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=' local.properties \
              | sed -E 's/^[[:space:]]*([A-Za-z0-9_.-]+)[[:space:]]*=.*$/\1/' \
              | sort -u
          fi

          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if property_present "${property_name}"; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
              echo "::warning::${property_name} is missing; the iOS build will show the missing-credentials state for that provider."
            fi
          done

          echo "local.properties configured."

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build StreamBridge IPA
        env:
          # Always unsigned: the published IPA is re-signed by the installer's
          # own Apple ID through AltStore/SideStore. build-ios-ipa.sh fails the
          # build if the application turns out to be signed anyway.
          STREAMBRIDGE_IOS_SIGNING: "0"
        run: ./scripts/build-ios-ipa.sh

      - name: Package IPA for the release
        id: package
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name 'streambridge-*-full-release.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "::error::No StreamBridge IPA was produced."
            exit 1
          fi
          if unzip -l "${ipa_path}" | grep -q '_CodeSignature'; then
            echo "::error::The produced IPA is signed; refusing to publish it."
            exit 1
          fi

          # The release asset name says outright that it is unsigned, so nobody
          # installs it from the release page expecting an App Store build.
          version="$(basename "${ipa_path}" | sed -E 's/^streambridge-(.*)-full-release\.ipa$/\1/')"
          release_ipa="dist/StreamBridge-${version}-iOS-unsigned.ipa"
          mkdir -p dist
          cp "${ipa_path}" "${release_ipa}"
          shasum -a 256 "${release_ipa}" >> checksums-ios.sha256

          {
            echo "## StreamBridge iOS release build"
            echo
            echo "- File: $(basename "${release_ipa}")"
            echo "- Size: $(du -h "${release_ipa}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${release_ipa}" | awk '{print $1}')"
            echo "- Signing: none (unsigned)"
            echo
            echo "> Install with AltStore or SideStore: the unsigned IPA is re-signed with"
            echo "> your own Apple ID at install time. \`store.json\` in this repository is"
            echo "> the sideload source that points at this release asset."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report IPA composition
        run: |
          set -euo pipefail
          ipa_path="$(find dist -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          ipa_bytes="$(stat -c%s "${ipa_path}" 2>/dev/null || stat -f%z "${ipa_path}")"
          {
            echo "### IPA composition ($(basename "${ipa_path}"))"
            echo
            echo "Total size: ${ipa_bytes} bytes"
            echo
            echo "Largest files:"
            echo
            echo '```'
            unzip -l "${ipa_path}" \
              | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); print $1"\t"name}' \
              | sort -k1,1 -rn | awk 'NR<=30'
            echo '```'
            echo
            echo "Size by directory (up to four levels):"
            echo
            echo '```'
            unzip -l "${ipa_path}" \
              | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); if (name=="") next; n=split(name,p,"/"); dir=""; for(i=1;i<=4 && i<n;i++) dir=dir p[i]"/"; sz[dir]+=$1} END {for (d in sz) printf "%12d  %s\n", sz[d], d}' \
              | sort -rn | awk 'NR<=30'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "IPA composition written to the job summary."
          # Annotations stay readable through the GitHub API even when the raw
          # Actions log cannot be downloaded, so the largest components are also
          # emitted as one notice annotation.
          top_components="$(unzip -l "${ipa_path}" \
            | awk 'NR>3 && NF>=4 {name=substr($0, index($0,$4)); if (name=="") next; n=split(name,p,"/"); dir=""; for(i=1;i<=4 && i<n;i++) dir=dir p[i]"/"; sz[dir]+=$1} END {for (d in sz) printf "%d %s\n", sz[d], d}' \
            | sort -rn | awk 'NR<=8 {printf "%s B in %s; ", $1, $2}')"
          echo "::notice title=IPA composition::total ${ipa_bytes} B; ${top_components}"

      - name: Upload StreamBridge iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-ios-unsigned-ipa
          path: |
            dist/*.ipa
          if-no-files-found: error

  draft:
    name: Draft GitHub Release (Android first)
    # Android is the release gate. The iOS IPA is produced by the independent
    # `ios` job above and attached by `attach-ios` when it finishes, so a slow or
    # failing iOS build can never hold up an Android release. iOS is still built
    # from the same tag and the same commit.
    needs: [android]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download production-signed APKs
        uses: actions/download-artifact@v8
        with:
          name: StreamBridge-production-full-release-apk
          path: release-assets

      - name: Create or verify the draft release without moving the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/verify-release-target.sh \
            --tag "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --verify-tag-ref

          # Resolve draft releases through the list API. The tag-specific
          # endpoint, and `gh release view/upload` by tag, return 404 for drafts.
          release_json="$(mktemp)"
          lookup_status=0
          scripts/release-api.sh lookup \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --json "${release_json}" \
            --attempts 1 \
            --delay 0 || lookup_status=$?

          if [[ "${lookup_status}" -eq 3 ]]; then
            # The tag was verified above; create only the draft release record.
            # Upload assets one by one by release ID so reruns can verify rather
            # than clobber anything already attached.
            gh release create "${TAG}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "StreamBridge ${TAG}" \
              --notes-file docs/RELEASE-NOTES-0.1.13.md
            lookup_status=0
            scripts/release-api.sh lookup \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "${TAG}" \
              --json "${release_json}" \
              --attempts 6 \
              --delay 5 || lookup_status=$?
          fi
          if [[ "${lookup_status}" -ne 0 ]]; then
            echo "::error::Could not resolve exactly one release object for ${TAG} (lookup exit ${lookup_status})."
            exit "${lookup_status}"
          fi

          if [[ "$(jq -r '.tag_name' "${release_json}")" != "${TAG}" \
            || "$(jq -r '.draft' "${release_json}")" != "true" \
            || "$(jq -r '.name' "${release_json}")" != "StreamBridge ${TAG}" \
            || "$(jq -r '.target_commitish' "${release_json}")" != "${GITHUB_SHA}" ]]; then
            echo "::error::Existing release metadata does not match the verified draft target; preserving it without changes."
            exit 1
          fi
          expected_notes="$(cat docs/RELEASE-NOTES-0.1.13.md)"
          actual_notes="$(jq -r '.body // ""' "${release_json}")"
          if [[ "${actual_notes}" != "${expected_notes}" ]]; then
            echo "::error::Existing draft notes differ from the approved 0.1.13 notes; preserving them without changes."
            exit 1
          fi

          # upload-artifact preserves paths relative to the common ancestor of
          # all uploaded files. Since checksums.sha256 is at the repository root,
          # the APKs remain under androidApp/build/outputs/... after download.
          android_assets=(
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            release-assets/androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            release-assets/checksums.sha256
          )
          for asset in "${android_assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::Missing required production asset: ${asset}"
              exit 1
            fi
            scripts/release-api.sh ensure-asset \
              --repo "${GITHUB_REPOSITORY}" \
              --json "${release_json}" \
              --file "${asset}"
          done

          jq '{tag_name, name, draft, target_commitish, assets:[.assets[]|{name,size,digest,state}]}' "${release_json}"

  attach-ios:
    name: Attach unsigned iOS IPA (independent)
    needs: [draft, ios]
    if: ${{ needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v8
        with:
          name: StreamBridge-ios-unsigned-ipa
          path: ios-assets

      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach IPA and record iOS installation notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_assets=(ios-assets/*.ipa)
          if [ "${#ipa_assets[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one iOS IPA artifact, found ${#ipa_assets[@]}."
            exit 1
          fi

          scripts/verify-release-target.sh \
            --tag "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --verify-tag-ref
          version_name="$(grep '^STREAMBRIDGE_VERSION_NAME=' streambridge.version.properties | cut -d= -f2 | tr -d '\r')"
          expected_ipa="StreamBridge-${version_name}-iOS-unsigned.ipa"
          if [ "$(basename "${ipa_assets[0]}")" != "${expected_ipa}" ]; then
            echo "::error::Expected ${expected_ipa}, got $(basename "${ipa_assets[0]}")."
            exit 1
          fi

          # Drafts are absent from the tag-specific release endpoint. Resolve by
          # list, upload through the draft's upload_url, and never clobber an
          # existing asset. The helper verifies SHA-256 on reruns.
          release_json="$(mktemp)"
          scripts/release-api.sh lookup \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --json "${release_json}" \
            --attempts 6 \
            --delay 5
          if [[ "$(jq -r '.tag_name' "${release_json}")" != "${TAG}" ]]; then
            echo "::error::Resolved release does not match ${TAG}."
            exit 1
          fi
          scripts/release-api.sh ensure-asset \
            --repo "${GITHUB_REPOSITORY}" \
            --json "${release_json}" \
            --file "${ipa_assets[0]}" \
            --name "${expected_ipa}"

          notes="$(mktemp)"
          jq -r '.body // ""' "${release_json}" >"${notes}"
          if ! grep -q '^### iOS installation' "${notes}"; then
            if ! grep -q '^### iOS status' "${notes}"; then
              echo "::error::Release notes have no expected iOS status placeholder; preserving the release unchanged."
              exit 1
            fi
            sed -i '/^### iOS status/,$d' "${notes}"
            ios_notes=(
              '### iOS installation'
              ''
              'The iOS build in this release is **unsigned**. Install it with'
              '[AltStore](https://altstore.io) or [SideStore](https://sidestore.io): either signs the IPA with'
              'your own Apple ID on your device, so no Apple Developer account and no App Store listing is'
              'involved.'
              ''
              'Add this repository as a source in AltStore or SideStore to get updates automatically:'
              ''
              '`https://raw.githubusercontent.com/sascio/MyBridge/main/store.json`'
              ''
              'See `docs/RELEASE-IOS.md` for the details.'
            )
            printf '%s\n' "${ios_notes[@]}" >>"${notes}"
            scripts/release-api.sh update-body \
              --repo "${GITHUB_REPOSITORY}" \
              --json "${release_json}" \
              --body-file "${notes}"
          fi

          jq '{tag_name, name, draft, assets:[.assets[]|{name,size,digest,state}]}' "${release_json}"

      - name: Refresh the sideload source now that an IPA exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The sideload source only lists releases that carry exactly one IPA.
          # It is triggered by `release: published`, which does not fire when an
          # asset is added later, so dispatch it explicitly. Best effort: a
          # failure here does not invalidate the attached IPA.
          gh workflow run update-store-source.yml -f tag="${TAG}" \
            || echo "::warning::Could not dispatch update-store-source.yml; run it manually for ${TAG}."
