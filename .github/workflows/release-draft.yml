name: Build StreamBridge signed Android and iOS release

# Manual test-builds produce verified signed artifacts only. Draft mode and tag
# pushes create/update a DRAFT; publication remains an explicit human action.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build signed artifacts only, or create a coordinated draft
        type: choice
        options: [test-build, draft]
        default: test-build
        required: true
      target:
        description: Platforms (both requires both signing setups)
        type: choice
        options: [both, android, ios]
        default: both
        required: true
      tag:
        description: Optional exact canonical tag (v0.5.5-beta); never overrides metadata
        type: string
        required: false
      ios_export_method:
        description: Distribution profiles must match this export model
        type: choice
        options: [release-testing, app-store-connect, enterprise]
        default: release-testing
        required: true
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: streambridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify isolated release source and canonical metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      target: ${{ steps.metadata.outputs.target }}
      mode: ${{ steps.metadata.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Source, identity, license and no-CloudStream guard
        run: |
          python3 .github/verify_update_track.py
          python3 -m unittest discover -s .github/tests -v
      - name: Read release metadata and reject mismatched requests
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args=(--tag "$GITHUB_REF_NAME")
            mode=draft
            target=both
          else
            if [[ -n "$REQUESTED_TAG" ]]; then args=(--tag "$REQUESTED_TAG"); fi
            mode="$REQUESTED_MODE"
            target="$REQUESTED_TARGET"
          fi
          case "$mode" in test-build|draft) ;; *) exit 1 ;; esac
          case "$target" in both|android|ios) ;; *) exit 1 ;; esac
          python3 .github/streambridge_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
          printf 'mode=%s\ntarget=%s\n' "$mode" "$target" >> "$GITHUB_OUTPUT"
          version="$(python3 -c 'import sys; sys.path.insert(0,".github"); from streambridge_release import check_release; print(check_release().version)')"
          test -s "docs/RELEASE-NOTES-${version}.md"

  android:
    name: Production Android certificate, tests, R8 APKs and AAB
    needs: prepare
    if: needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
      NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      STREAMBRIDGE_REQUIRE_PRODUCTION_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the established production keystore (never invent one)
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          required=['NUVIO_RELEASE_STORE_BASE64','NUVIO_RELEASE_STORE_PASSWORD','NUVIO_RELEASE_KEY_ALIAS','NUVIO_RELEASE_KEY_PASSWORD']
          missing=[k for k in required if not os.environ.get(k)]
          if missing: raise SystemExit('Missing production GitHub Secrets: '+', '.join(missing)+'. See docs/SIGNING.md.')
          path=Path(os.environ['RUNNER_TEMP'])/'streambridge-upload.jks'
          path.write_bytes(base64.b64decode(''.join(os.environ['NUVIO_RELEASE_STORE_BASE64'].split()),validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write(f'NUVIO_RELEASE_STORE_FILE={path}\n')
          PY
      - name: Optional runtime API/OAuth configuration (values are never logged)
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: python3 .github/configure_runtime.py
      - run: bash .github/setup_android_sdk.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Run the stable shared and Android unit suites
        run: ./gradlew :composeApp:check :androidApp:testFullDebugUnitTest --stacktrace
      - name: Build minified production APKs and AAB
        run: |
          ./gradlew :androidApp:assembleFullRelease --stacktrace
          test -s androidApp/build/outputs/mapping/fullRelease/mapping.txt
          python3 .github/package_android.py --production
          ./gradlew :androidApp:clean :androidApp:bundleFullRelease --stacktrace
          python3 .github/package_android.py --production --aab-only
          python3 .github/apk-size-report.py build/artifacts/android > build/artifacts/android/apk-size-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-production-Android
          path: build/artifacts/android/
          if-no-files-found: error
      - name: Preserve test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-production-Android-test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
      - name: Delete signing/runtime inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/streambridge-upload.jks" local.properties

  ios:
    name: Production iOS profiles, archive and signed IPA
    needs: prepare
    if: needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'ios'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx10g
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: actions/cache@v5
        with:
          path: |
            ~/.konan
            .cache/ios
          key: streambridge-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '.gitmodules', 'scripts/prepare-ios-dependencies.sh') }}
      - name: Resolve Apple dependencies and validate Release configuration before signing
        run: |
          ./scripts/prepare-ios-dependencies.sh
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme StreamBridge
          xcodebuild -showBuildSettings -project iosApp/iosApp.xcodeproj -scheme StreamBridge -configuration Release CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/streambridge-ios-build-settings.txt"
      - name: Require and validate StreamBridge Apple signing credentials
        id: signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_export_method || 'release-testing' }}
        run: python3 .github/prepare_ios_signing.py
      - name: Optional runtime API/OAuth configuration
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: python3 .github/configure_runtime.py
      - name: Archive and export the signed StreamBridge IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          IOS_APP_PROFILE_UUID: ${{ steps.signing.outputs.app_profile }}
          IOS_WIDGET_PROFILE_UUID: ${{ steps.signing.outputs.widget_profile }}
          IOS_EXPORT_OPTIONS: ${{ steps.signing.outputs.export_options }}
        run: ./scripts/build-ios-archive.sh signed
      - uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-production-iOS
          path: build/artifacts/ios/
          if-no-files-found: error
      - name: Remove private signing files, restore keychains and clear runtime properties
        if: always()
        run: |
          python3 .github/prepare_ios_signing.py --cleanup
          rm -f local.properties

  draft:
    name: Coordinate StreamBridge Android and iOS draft assets
    needs: [prepare, android, ios]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'draft' &&
      (needs.android.result == 'success' || needs.prepare.outputs.target == 'ios') &&
      (needs.ios.result == 'success' || needs.prepare.outputs.target == 'android')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: StreamBridge-production-*
          path: build/release-inputs
      - name: Stage only validated production assets and combined checksums
        env:
          RELEASE_TARGET: ${{ needs.prepare.outputs.target }}
        run: python3 .github/stage_release.py
      - name: Create or update a draft for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || { echo '::error::Existing release tag points at a different source commit.'; exit 1; }
          fi
          args=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then args=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true || { echo '::error::Refusing to overwrite an already published release.'; exit 1; }
            gh release upload "$RELEASE_TAG" build/release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "StreamBridge $RELEASE_VERSION" --notes-file "docs/RELEASE-NOTES-$RELEASE_VERSION.md" "${args[@]}"
          else
            gh release create "$RELEASE_TAG" build/release-assets/* --draft "${args[@]}" \
              --target "$GITHUB_SHA" --title "StreamBridge $RELEASE_VERSION" \
              --notes-file "docs/RELEASE-NOTES-$RELEASE_VERSION.md"
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets --jq '{tagName,isDraft,isPrerelease,assets:[.assets[].name]}'
