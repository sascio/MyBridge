name: Draft production GitHub Release

# Manual only. Never runs on branch push. Never publishes (draft only).
# Fails closed unless production upload-keystore GitHub Secrets are set.
# See docs/SIGNING.md. Do not use CI debug-signed APKs as updates.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching STREAMBRIDGE_VERSION_NAME (e.g. v0.1.07)
        required: true
        type: string
        default: "v0.1.07"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    name: Production-signed full APK draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Require production signing secrets
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in NUVIO_RELEASE_STORE_BASE64 NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var GitHub secret is not set. Production release cannot proceed. See docs/SIGNING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify tag matches StreamBridge version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f streambridge.version.properties ]; then
            echo "::error::streambridge.version.properties is missing on the checked-out tree."
            exit 1
          fi
          version_name="$(grep '^STREAMBRIDGE_VERSION_NAME=' streambridge.version.properties | cut -d= -f2 | tr -d '\r')"
          tag="${TAG#v}"
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Release tag must match STREAMBRIDGE_VERSION_NAME ($version_name). Got $TAG."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          NUVIO_RELEASE_STORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$NUVIO_RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks"

      # Official NuvioMobile credential-supply mechanism, reproduced from
      # NuvioMedia/NuvioMobile .github/workflows/android-release.yml ("Configure
      # release properties"). :composeApp generateRuntimeConfigs reads the
      # Trakt/Simkl keys out of local.properties only, so CI has to materialise that
      # file before Gradle runs. Nothing is echoed: base64 -d writes straight to the
      # file and the checks only test for presence.
      #
      # NUVIO_LOCAL_PROPERTIES_BASE64 is optional. Trakt/Simkl are not configured for
      # every release, so when the secret is absent CI creates an empty
      # local.properties and the build proceeds with unconfigured Trakt/Simkl (empty
      # generated credentials). No placeholder credentials are ever injected.
      - name: Configure release properties
        env:
          NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${NUVIO_LOCAL_PROPERTIES_BASE64}" ]; then
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 not set; using empty local.properties (Trakt/Simkl unconfigured for this build)."
            exit 0
          fi

          printf '%s' "${NUVIO_LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          # sdk.dir is runner-specific and the keystore is decoded separately above,
          # so drop any copies carried inside the secret (official does the same).
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

          # Trakt/Simkl properties are optional: a missing TRAKT_CLIENT_ID,
          # TRAKT_CLIENT_SECRET or SIMKL_CLIENT_ID must not fail the release.
          # Presence-only report; values are never printed.
          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID; do
            if grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*\S" local.properties; then
              echo "${property_name} present=true"
            else
              echo "${property_name} present=false"
            fi
          done

          echo "local.properties configured."

      - name: Assemble production full release
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/upload.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STREAMBRIDGE_REQUIRE_PRODUCTION_SIGNING: "true"
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Trakt/Simkl are deliberately NOT passed as environment variables. They are
          # supplied through the decoded local.properties above, which is the official
          # NuvioMobile mechanism and the only credential path this build supports.
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      # Presence-only report of what reached the generated runtime config
      # (local.properties -> generateRuntimeConfigs -> TraktConfig/SimklConfig).
      # Trakt/Simkl credentials are optional, so empty generated values must not
      # fail the release. Greps the generated Kotlin for an empty literal; never
      # prints a value.
      - name: Report generated Trakt/Simkl config presence
        run: |
          set -euo pipefail
          generated="composeApp/build/generated/runtime-config/kotlin"
          trakt="$generated/com/nuvio/app/features/trakt/TraktConfig.kt"
          simkl="$generated/com/nuvio/app/features/simkl/SimklConfig.kt"

          report_populated() {
            local file="$1" constant="$2"
            if [ ! -f "$file" ]; then
              echo "::warning::Generated config missing: $file"
              return
            fi
            if grep -Eq "const val ${constant} = \"\"" "$file"; then
              echo "${constant} present=false"
            else
              echo "${constant} present=true"
            fi
          }

          report_populated "$trakt" CLIENT_ID
          report_populated "$trakt" CLIENT_SECRET
          report_populated "$simkl" CLIENT_ID

      - name: Reject debug certificates and record public cert identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full/release APKs were produced."
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools. Cannot verify production signature."
            exit 1
          fi
          expected_sha256="5da621d8e6f5c4ffb7396de3fbf686f3bf61bcec71cccffba9bbbbdef56285fc"
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$certs"
            if printf '%s\n' "$certs" | grep -Ei 'CN=Android Debug|Android Debug'; then
              echo "::error::$apk is signed with the Android Debug certificate. Refusing to attach it to a release."
              exit 1
            fi
            got_sha256="$(printf '%s\n' "$certs" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr 'A-F' 'a-f' | tr -d ' :')"
            if [ "$got_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate SHA-256 does not match the StreamBridge production upload certificate."
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | tee checksums.sha256

      - name: Require expected production APKs
        run: |
          set -euo pipefail
          missing=0
          for f in \
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk \
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk \
            checksums.sha256
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required production asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload production-signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: StreamBridge-production-full-release-apk
          path: |
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            checksums.sha256
          if-no-files-found: error

      - name: Ensure git tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "Using existing tag ${TAG} -> ${tagged}"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "Created tag ${TAG} -> ${GITHUB_SHA}"
          fi

          assets=(
            androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86-release.apk
            androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            checksums.sha256
          )
          notes="$(mktemp)"
          cat > "$notes" <<'EOF'
          ## StreamBridge 0.1.07

          - Updated core baseline to official NuvioMobile 0.5.2-beta.
          - Upgraded Nuvio engine to 0.1.2 with binary fetch support.
          - Added Simkl "More Like This" recommendations provider and tracking toggle.
          - Added per-screen custom poster URL pattern controls with Profile Settings Sync v4 schema.
          - Integrated PlaybackKey player lifecycle management and post-credits next episode timing.
          - Added gesture percentage overlay for volume and brightness adjustments.
          - Integrated NuvioMobile-Enhanced Profile Insights Taste DNA genre donut chart.
          - Added password manager autofill support for login and registration.
          - Added device-local appearance and bottom navigation configuration sheets.
          - Updated iOS lifecycle, MPV bridge rendering, and dependency preparation scripts.
          - Preserved StreamBridge branding, updater, metadata enrichment, avatars, addons, and CloudStream runtime.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --title "StreamBridge ${TAG}" --draft
          else
            gh release create "${TAG}" "${assets[@]}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "StreamBridge ${TAG}" \
              --notes-file "$notes"
          fi

          gh release view "${TAG}" --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'
