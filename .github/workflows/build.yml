name: Build Stream Bridge

on:
  push:
    branches: [main, arena/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Nuvio-core full Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -x
          exec > >(tee -a gradle-build.log) 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # The runner image ships minor-versioned platforms (android-37.0,
          # android-37.1, ...); the unsuffixed "platforms;android-37" package
          # no longer exists, so installing it hard-fails the job. AGP resolves
          # compileSdk=37 + compileSdkMinor=0 to android-37.0, which is already
          # present, so only install what is genuinely missing.
          PLATFORM="android-${ANDROID_COMPILE_SDK}.${ANDROID_COMPILE_SDK_MINOR}"
          if [ -d "$SDK/platforms/$PLATFORM" ]; then
            echo "platform $PLATFORM already installed"
          else
            "$SDKMANAGER" --install "platforms;$PLATFORM"
          fi
          if [ -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" ]; then
            echo "build-tools ${ANDROID_BUILD_TOOLS} already installed"
          else
            "$SDKMANAGER" --install "build-tools;${ANDROID_BUILD_TOOLS}"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        env:
          ANDROID_COMPILE_SDK: '37'
          ANDROID_COMPILE_SDK_MINOR: '0'
          ANDROID_BUILD_TOOLS: '36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "::add-matcher::.github/problem-matchers.json"
          set -o pipefail
          # composeApp uses the new KMP android library plugin (withHostTest),
          # which does not produce the classic testFooDebugUnitTest task names.
          # Discover the JVM host-test task instead of hardcoding a guess.
          # Note: grep exits 1 on no match and the step runs under -e/pipefail,
          # so every stage here is explicitly guarded.
          ./gradlew :composeApp:tasks --all -q > /tmp/alltasks.txt 2>&1 || true
          {
            echo "--- candidate test tasks ---"
            grep -iE '(test|check)' /tmp/alltasks.txt | head -60 || true
            echo "----------------------------"
          } | tee -a gradle-build.log
          TASK="$(awk '{print $1}' /tmp/alltasks.txt \
            | grep -iE '^(android.*HostTest|.*UnitTest|jvmTest|testDebugUnitTest)$' \
            | sort -u | head -n1 || true)"
          if [ -z "$TASK" ]; then
            echo "no host-test task matched; see candidates above" | tee -a gradle-build.log
            exit 1
          fi
          echo "running :composeApp:$TASK" | tee -a gradle-build.log
          ./gradlew ":composeApp:$TASK" --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Stream-Bridge-unit-test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

      - name: Assemble Nuvio full debug and release APKs
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "::add-matcher::.github/problem-matchers.json"
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug :androidApp:assembleFullRelease --stacktrace 2>&1 | tee -a gradle-build.log

      - name: APK size report
        run: python3 .github/apk-size-report.py androidApp/build/outputs/apk/full/release

      - name: Record that CI release APKs are not production
        run: |
          set -euo pipefail
          mkdir -p signing-status
          cat > signing-status/CI-NOT-PRODUCTION.txt <<'EOF'
          These GitHub Actions artifacts are compile-validation APKs.

          This workflow does not inject production keystore secrets.
          assembleFullRelease therefore uses the debug signing config.

          Release outputs are per-ABI (arm64-v8a, armeabi-v7a, x86, x86_64),
          matching NuvioMobile. Do not publish these APKs as GitHub Releases
          and do not install them as in-app updates over a production-signed
          build.

          Production drafts: .github/workflows/release-draft.yml
          See docs/SIGNING.md
          EOF

      - name: Upload full debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Stream-Bridge-CI-full-debug-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: Upload full release APK (debug-signed, not production)
        uses: actions/upload-artifact@v6
        with:
          name: Stream-Bridge-CI-full-release-APK-not-production
          path: |
            androidApp/build/outputs/apk/full/release/*.apk
            signing-status/CI-NOT-PRODUCTION.txt
          if-no-files-found: error

      - name: Close resolved CI-failure issues
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 100
            });
            let closed = 0;
            for (const issue of issues) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Build is green again as of commit `' + context.sha.slice(0, 7) +
                    '` — closing this auto-generated CI failure report.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                closed++;
              } catch (e) {
                core.info('Issue ' + issue.number + ' skipped: ' + e.message);
              }
            }
            core.info('Closed ' + closed + ' of ' + issues.length + ' open ci-failure issue(s).');

      - name: Report failure log as an issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('gradle-build.log', 'utf8');
            } catch (e) {
              log = 'No gradle-build.log captured: ' + e.message;
            }
            const lines = log.split('\n');
            const errorLines = lines.filter(l =>
              /^e: /.test(l) ||
              /error:/.test(l) ||
              / FAILED$/.test(l) ||
              /AssertionError/.test(l) ||
              /Exception/.test(l) ||
              /Caused by/.test(l) ||
              /LinkageError|UnsatisfiedLink|NoClassDef/.test(l) ||
              /BUILD FAILED/.test(l) ||
              /What went wrong/.test(l) ||
              /Unable to process command/.test(l) ||
              /tests? completed/.test(l)
            );
            const tail = lines.slice(-120).join('\n');
            const errorBlock = errorLines.slice(0, 400).join('\n');
            const body = [
              'CI build failed for commit `' + context.sha.slice(0, 7) + '` on branch `' + (context.ref || '') + '`.',
              '',
              '## Errors',
              '',
              '```',
              errorBlock.slice(0, 40000),
              '```',
              '',
              '## Log tail',
              '',
              '```',
              tail.slice(0, 12000),
              '```'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI failure: ' + context.sha.slice(0, 7),
              labels: ['ci-failure'],
              body: body
            });
