name: Build Stream Bridge

on:
  push:
    branches: [main, arena/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests & debug APK
        run: |
          echo "::add-matcher::.github/problem-matchers.json"
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --continue --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Bridge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report failure log as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('gradle-build.log', 'utf8');
            } catch (e) {
              log = 'No gradle-build.log captured: ' + e.message;
            }
            const lines = log.split('\n');
            // All compiler/test error lines first (they are what matters),
            // then a short tail for task-level context.
            const errorLines = lines.filter(l =>
              /^e: /.test(l) ||
              /error:/.test(l) ||
              /FAILED/.test(l) ||
              /What went wrong/.test(l) ||
              /^> /.test(l) ||
              /tests? (failed|completed)/i.test(l)
            );
            const tail = lines.slice(-120).join('\n');
            const errorBlock = errorLines.slice(0, 400).join('\n');
            const body = [
              'CI build failed for commit `' + context.sha.slice(0, 7) + '` on branch `' + (context.ref || '') + '`.',
              '',
              '## Errors',
              '',
              '```',
              errorBlock.slice(0, 40000),
              '```',
              '',
              '## Log tail',
              '',
              '```',
              tail.slice(0, 12000),
              '```'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI failure: ' + context.sha.slice(0, 7),
              labels: ['ci-failure'],
              body: body
            });
