name: Validate StreamBridge Android and iOS

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['docs/**', 'README.md', 'NOTICE', 'CHANGELOG.md', 'branding/README.md']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: streambridge-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Release metadata, branding and stable-track guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source identity, attribution and isolation
        run: python3 .github/verify_update_track.py
      - name: Test release tooling
        run: python3 -m unittest discover -s .github/tests -v
      - name: Lint workflow definitions (verified actionlint binary)
        run: bash .github/check_workflows.sh
      - name: Validate build script syntax
        run: bash -n scripts/build-ios-archive.sh scripts/prepare-ios-dependencies.sh .github/setup_android_sdk.sh

  android:
    name: Android Kotlin, tests, debug and R8 release
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the verified Android SDK
        run: bash .github/setup_android_sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile debug Kotlin (KMP library and full app variant)
        run: |
          echo '::add-matcher::.github/problem-matchers.json'
          ./gradlew :composeApp:compileAndroidMain :androidApp:compileFullDebugKotlin --stacktrace 2>&1 | tee compile-debug.log
      - name: Analyze release dependency resolution
        run: |
          ./gradlew :androidApp:dependencies --configuration fullReleaseRuntimeClasspath > dependencies.txt
          for dependency in androidx.media3 okhttp kotlin-stdlib quickjs; do
            ./gradlew :androidApp:dependencyInsight --configuration fullReleaseRuntimeClasspath --dependency "$dependency" >> dependency-insight.txt
          done
      - name: Run shared and Android host unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :composeApp:check :androidApp:testFullDebugUnitTest --continue --stacktrace 2>&1 | tee unit-tests.log
      - name: Build debug, minified release APKs and full AAB (non-production signing)
        run: |
          # APK splits affect every variant in an invocation. Debug is universal;
          # APK release is split; bundle release must have splits disabled.
          ./gradlew :androidApp:assembleFullDebug --stacktrace 2>&1 | tee android-build.log
          ./gradlew :androidApp:assembleFullRelease --stacktrace 2>&1 | tee -a android-build.log
          test -s androidApp/build/outputs/mapping/fullRelease/mapping.txt
          mkdir -p build/reports/android-apk-mapping
          cp -R androidApp/build/outputs/mapping/fullRelease/. build/reports/android-apk-mapping/
          python3 .github/package_android.py --debug 2>&1 | tee -a android-build.log
          # Remove only application-module generated outputs before the unsplit
          # bundle shrink, so AGP does not encounter old per-ABI resource protos.
          ./gradlew :androidApp:clean :androidApp:bundleFullRelease --stacktrace 2>&1 | tee -a android-build.log
          python3 .github/package_android.py --aab-only 2>&1 | tee -a android-build.log
      - name: Expose actionable build/test failures as check annotations
        if: always()
        run: python3 .github/report_validation.py
      - name: APK size report
        if: always()
        run: |
          if compgen -G 'build/artifacts/android/*.apk' >/dev/null; then
            python3 .github/apk-size-report.py build/artifacts/android | tee apk-size-report.txt
          fi
      - name: Upload validation APKs and AAB (never production)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-Android-validation-not-production
          path: build/artifacts/android/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload tests, dependency analysis, R8 mapping and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-Android-validation-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
            androidApp/build/reports/tests/
            androidApp/build/test-results/
            androidApp/build/outputs/mapping/fullRelease/
            build/reports/android-apk-mapping/
            *.log
            dependencies.txt
            dependency-insight.txt
            apk-size-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Make unit-test failures a hard gate after preserving diagnostic artifacts
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo '::error::StreamBridge unit tests failed. Inspect the validation reports; this run is not release-ready.'
          exit 1

  ios:
    name: iOS Release dependencies and unsigned archive
    needs: audit
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx8g
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.konan
            .cache/ios
          key: streambridge-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '.gitmodules', 'scripts/prepare-ios-dependencies.sh') }}
      - name: Resolve dependencies, build and validate unsigned Release archive
        run: ./scripts/build-ios-archive.sh unsigned 2>&1 | tee ios-build.log
      - name: Upload unsigned device archive and IPA (requires re-signing)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-iOS-unsigned-validation
          path: build/artifacts/ios/
          if-no-files-found: error
          retention-days: 7
      - name: Annotate actual iOS compiler errors
        if: failure()
        run: python3 .github/report_validation.py
      - name: Preserve separate iOS build logs (not app artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StreamBridge-iOS-build-reports
          path: ios-build.log
          if-no-files-found: warn
          retention-days: 7
