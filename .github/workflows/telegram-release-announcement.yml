name: Telegram release announcement

# Publishes a StreamBridge release announcement to the Telegram channel once a
# GitHub Release is published. Announcements only: this workflow never creates,
# edits, publishes or deletes a release, and it never touches the Android or iOS
# build jobs.
#
# Trigger: `release: published` only. Draft creation, tag pushes, ordinary pushes
# and pre-releases are not announced (the job re-checks draft/prerelease and the
# scripts exit cleanly for them anyway).
#
# Duplicate protection is the release id, not the event delivery:
#   * every page carries the hashtag `#SB<release id>` in its footer;
#   * before sending, `getChat` is read and the channel's pinned message is
#     checked for that tag;
#   * after a fully confirmed send, `.github/telegram-releases.json` records the
#     release id and the first message is pinned.
# A rerun, a retried job or a duplicated event therefore finds the tag and stops.
# `concurrency` below only keeps two runs from racing; it is not the protection.
#
# Binary delivery: the production APKs (52-56 MiB) and the unsigned IPA (~70 MiB)
# exceed the 50 MB ceiling of the public Bot API, so they are uploaded over
# MTProto by the same bot that posts the announcement. MTProto raises a bot's
# per-file ceiling to 2000 MB; no second service, user account, phone number or
# login code is involved. Downloads are verified by size and (when the release
# publishes checksums) SHA-256 before a single byte is uploaded.
#
# Credentials: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets, plus
# TELEGRAM_API_ID / TELEGRAM_API_HASH (from my.telegram.org -> API development
# tools) for the MTProto upload. All are read into the step environment only. The
# token and hash are never echoed, never passed as arguments and never written to
# an artifact; GitHub masks secrets in logs and the scripts also redact token
# patterns. If TELEGRAM_API_ID/HASH are absent the announcement is still posted
# and the binaries are reported as not delivered; the GitHub release is unaffected.
#
# The bot must be an administrator of @StreamBridge_App with "Post Messages"
# (and "Pin Messages" for the pinned duplicate guard). Without pin rights the
# announcement still posts; only the pin step reports a warning.
#
# Manual runs: `preflight` checks Telegram readiness without publishing anything,
# independently of every other input. Otherwise `dry_run` renders and validates
# the exact messages without sending them. Set `tag` to render a specific release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      preflight:
        description: Check Telegram readiness without posting or uploading (ignores all other inputs)
        required: false
        type: boolean
        default: false
      tag:
        description: Published release tag to render (empty = latest published release)
        required: false
        type: string
      dry_run:
        description: Render and validate the announcement without sending it
        required: false
        type: boolean
        default: true
      upload_assets:
        description: Download and upload the APK/IPA files as Telegram documents
        required: false
        type: boolean
        default: true

permissions:
  # Preflight needs only a checkout. The announcement job requests write access
  # separately for its post ledger commit; no other scope is requested.
  contents: read

concurrency:
  # Serialise by release id when the id is known, so a rerun cannot interleave
  # with the run it is retrying. cancel-in-progress stays false: a run that is
  # already posting must be allowed to finish before the retry inspects the
  # channel.
  # Preflight has its own group, so it cannot delay or replace a pending release
  # announcement (or be grouped according to the otherwise ignored tag input).
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight == true && format('telegram-preflight-{0}', github.run_id) || format('telegram-announcement-{0}', github.event.release.id || inputs.tag || 'latest') }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only Telegram preflight
    if: github.event_name == 'workflow_dispatch' && inputs.preflight == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the announcement tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned MTProto dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'telethon==1.42.0' 'pyaes==1.6.1' 'rsa==4.9.1' 'pyasn1==0.6.1'

      - name: Verify Telegram readiness (read-only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          report_result() {
            status=$?
            if [[ "${status}" == 0 ]]; then
              echo "::notice title=Telegram preflight passed::Bot authentication, channel access, administrator status, Post Messages and MTProto channel history were verified."
              printf '### Telegram preflight\n\n**Passed:** all readiness checks succeeded. Nothing was published or uploaded.\n' >>"${GITHUB_STEP_SUMMARY}"
            else
              echo "::error title=Telegram preflight failed::Readiness was not verified (exit ${status}); see the errors above."
              printf '### Telegram preflight\n\n**Failed:** see the errors in the log. Nothing was published or uploaded.\n' >>"${GITHUB_STEP_SUMMARY}"
            fi
          }
          trap report_result EXIT

          # Unlike the announcement path, preflight must fail if *any* of the
          # four credentials is missing: otherwise the existing script warns and
          # skips the history check. Never print a secret's value.
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            value="${!name-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::The ${name} secret is not configured. Add it in Settings > Secrets and variables > Actions."
              missing=1
            elif [[ "${value}" =~ [[:space:]] ]]; then
              echo "::error::The ${name} secret must be a single line with no whitespace."
              missing=1
            else
              printf '::add-mask::%s\n' "${value}"
            fi
          done
          if [[ "${missing}" != 0 ]]; then
            exit 3
          fi

          # Fabricated metadata is required by the existing CLI. No release API,
          # tag, asset, CLI summary file, or post ledger is involved in this probe.
          release_json="${RUNNER_TEMP}/telegram-preflight-release.json"
          cat >"${release_json}" <<'JSON'
          {
            "id": 0,
            "tag_name": "v0.0.0",
            "name": "Telegram preflight fixture (not a release)",
            "body": "",
            "html_url": "https://example.invalid/preflight",
            "draft": false,
            "prerelease": false,
            "assets": []
          }
          JSON

          # getChat reports channel details, not the bot's membership. Reuse the
          # existing Bot API client and its authentication/retry handling for the
          # additional read-only membership checks; no second auth logic exists.
          # Do these first so the CLI cannot announce a pass before rights fail.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import telegram_announce as announce

          token = announce.require_env("TELEGRAM_BOT_TOKEN")
          chat_id = announce.require_env("TELEGRAM_CHAT_ID")
          client = announce.TelegramClient(token, chat_id)

          identity = client.call("getMe")
          bot = identity.result or {}
          bot_id = bot.get("id")
          if not identity.ok or bot.get("is_bot") is not True or type(bot_id) is not int or bot_id <= 0:
              announce.error("Bot authentication failed: getMe did not return a valid bot. Check TELEGRAM_BOT_TOKEN.")
              raise SystemExit(announce.EXIT_ERROR)
          print("Bot authentication verified with getMe.")

          channel = client.get_chat()
          if not channel.ok or (channel.result or {}).get("type") != "channel":
              announce.error("Channel access failed: getChat did not return a channel. Check TELEGRAM_CHAT_ID and bot membership.")
              raise SystemExit(announce.EXIT_ERROR)
          print("Channel access verified with getChat.")

          membership = client.call("getChatMember", {"chat_id": chat_id, "user_id": bot_id})
          member = membership.result or {}
          if not membership.ok:
              announce.error("Could not verify bot membership with getChatMember. Check channel access and TELEGRAM_CHAT_ID.")
              raise SystemExit(announce.EXIT_ERROR)
          if member.get("status") != "administrator":
              announce.error("The bot is not an administrator of the channel (getChatMember).")
              raise SystemExit(announce.EXIT_ERROR)
          if member.get("can_post_messages") is not True:
              announce.error("The bot administrator lacks the required Post Messages permission.")
              raise SystemExit(announce.EXIT_ERROR)
          print("Administrator status and Post Messages permission verified with getChatMember.")
          PY

          # Never pass --dry-run here: the existing CLI selects dry-run before
          # --preflight. Its getChat membership warning is not authoritative;
          # the explicit getChatMember check above is the actual rights check.
          echo "::notice::Administrator rights were verified above; the existing preflight's getChat membership hint is not authoritative."
          python3 scripts/telegram_announce.py --release-json "${release_json}" --preflight

  announce:
    name: Announce the published release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preflight always wins over every dispatch input. Official releases only:
    # a draft or a pre-release is never announced.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.preflight != true) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.release.draft == false && github.event.release.prerelease == false))

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the announcement tooling
        # Pinned to the commit v6 resolves to: a retagged action cannot change
        # what runs inside this job.
        #
        # `ref` matters: a `release` event checks out the release *tag*, so a job
        # would run the scripts as they were when that release was cut. Later
        # fixes to the tooling would never apply to the next release. The default
        # branch always holds the newest tooling, so it is requested explicitly.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # A token is kept so the ledger commit below can actually push. It is
          # this job's own token: `permissions: contents: write` for this job, nothing
          # else, and the checkout is discarded with the runner.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the MTProto client
        # Telethon is only needed to carry the APK/IPA files over MTProto. It is
        # installed first so a missing package fails here, before anything is
        # posted, rather than halfway through a delivery. The version is pinned
        # to a compatible range; the harness is not security-critical.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'telethon>=1.36,<2'
          python3 -c "import telethon; print('Telethon', telethon.__version__)"

      - name: Resolve the release to announce
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/telegram"
          release_json="${RUNNER_TEMP}/telegram/release.json"

          # Dry run by default on a manual dispatch; a `release: published` event
          # is the real announcement.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DRY_RUN_INPUT}" != "false" ]]; then
            echo "dry_run=true" >>"${GITHUB_OUTPUT}"
          else
            echo "dry_run=false" >>"${GITHUB_OUTPUT}"
          fi

          if [[ "${EVENT_NAME}" == "release" ]]; then
            # The event payload is only used to decide whether this release is
            # official; the announcement itself is always rendered from the API
            # object, which is the authoritative record of assets and URLs.
            if [[ "${EVENT_RELEASE_DRAFT}" != "false" || "${EVENT_RELEASE_PRERELEASE}" != "false" ]]; then
              echo "::notice::Release ${EVENT_RELEASE_TAG} is a draft or a pre-release; nothing is announced."
              echo "skip=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/${EVENT_RELEASE_ID}" >"${release_json}"
            echo "Reading release id ${EVENT_RELEASE_ID} (${EVENT_RELEASE_TAG}) through the API."
          elif [[ -n "${INPUT_TAG}" ]]; then
            # A manual dispatch for a specific tag. Drafts answer 404 here, which
            # is exactly the behaviour we want: drafts are never announced.
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${INPUT_TAG}" >"${release_json}"
            echo "Reading release ${INPUT_TAG} through the API."
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >"${release_json}"
            echo "Reading the latest published release through the API."
          fi

          python3 - "${release_json}" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("draft") or data.get("prerelease"):
              print("::notice::The resolved release is a draft or a pre-release; nothing is announced.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("skip=true\n")
              raise SystemExit(0)
          print(f"Release id {data['id']}, tag {data['tag_name']}, name {data.get('name')!r}, "
                f"assets {len(data.get('assets') or [])}, notes {len(data.get('body') or '')} chars")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"release_id={data['id']}\n")
              out.write(f"tag_name={data['tag_name']}\n")
              out.write(f"version={str(data['tag_name']).lstrip('v')}\n")
              out.write(f"asset_count={len(data.get('assets') or [])}\n")
              out.write("skip=false\n")
          PY

      - name: Validate the announcement without sending it
        env:
          RELEASE_JSON: ${{ runner.temp }}/telegram/release.json
        run: |
          set -euo pipefail
          # Always validate first, in every mode: a dispatch that sends must not
          # be able to post something the dry run would have rejected.
          python3 scripts/telegram_announce.py \
            --release-json "${RELEASE_JSON}" \
            --dry-run \
            --summary "${RUNNER_TEMP}/telegram/dry-run-summary.json"

      - name: Publish the announcement
        id: publish
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.preflight != true) &&
          steps.release.outputs.skip != 'true'
        env:
          # Secrets reach the process through the environment only.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_JSON: ${{ runner.temp }}/telegram/release.json
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          args=(--release-json "${RELEASE_JSON}" --ledger .github/telegram-releases.json
                --summary "${RUNNER_TEMP}/telegram/summary.json")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          status=0
          python3 scripts/telegram_announce.py "${args[@]}" || status=$?
          case "${status}" in
            0)
              echo "announced=true" >>"${GITHUB_OUTPUT}"
              ;;
            2)
              echo "::notice title=Already announced::StreamBridge ${RELEASE_VERSION} was already announced to the Telegram channel; nothing was sent again."
              echo "announced=true" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error title=Telegram announcement failed::StreamBridge ${RELEASE_VERSION} was not announced (exit ${status}). The published GitHub release is unaffected. Fix the cause above and re-run this workflow: a duplicate cannot be posted, because the release id is checked before every send."
              exit "${status}"
              ;;
          esac
          {
            echo "### Telegram announcement — StreamBridge ${RELEASE_VERSION}"
            echo
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "**Dry run:** the messages above were rendered and validated, nothing was sent."
            else
              echo "The announcement for \`${RELEASE_TAG}\` was published to the StreamBridge Telegram channel."
            fi
            echo
            if [[ -f "${RUNNER_TEMP}/telegram/summary.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/telegram/summary.json"
              echo '```'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Deliver the APK and IPA files to Telegram
        id: upload
        # Runs after the announcement, so users always have the message and the
        # GitHub buttons even if an upload fails. A failed upload is reported as a
        # warning, never as a failed release: the GitHub release is already live
        # and every file keeps its verified direct link in the announcement.
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.preflight != true) &&
          steps.release.outputs.skip != 'true' &&
          steps.release.outputs.dry_run != 'true' &&
          (github.event_name == 'release' || inputs.upload_assets != false)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELEASE_JSON: ${{ runner.temp }}/telegram/release.json
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Downloads live in the runner's temp directory, outside the checkout,
          # so a multi-hundred-megabyte binary can never be committed or uploaded
          # as an artifact. They are deleted per asset as soon as they are sent.
          workspace="${RUNNER_TEMP}/telegram-assets"
          status=0
          python3 scripts/telegram_assets.py \
            --release-json "${RELEASE_JSON}" \
            --workspace "${workspace}" \
            --ledger .github/telegram-releases.json \
            --summary "${RUNNER_TEMP}/telegram/assets.json" || status=$?

          case "${status}" in
            0)
              echo "delivered=true" >>"${GITHUB_OUTPUT}"
              ;;
            3)
              # Missing TELEGRAM_API_ID / TELEGRAM_API_HASH. The announcement has
              # already been posted and the release is live, so this is a warning
              # with an exact remedy rather than a failed run.
              echo "::warning title=Large-file uploads are not configured::StreamBridge ${RELEASE_VERSION} was announced, but the APK/IPA files were not uploaded because TELEGRAM_API_ID and TELEGRAM_API_HASH are not set. Add both in Settings -> Secrets and variables -> Actions (my.telegram.org -> API development tools); nothing else changes, and a manual re-run will upload the files without re-posting the announcement."
              echo "delivered=false" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::warning title=Some files were not delivered::One or more APK/IPA files for StreamBridge ${RELEASE_VERSION} could not be uploaded. The announcement and the GitHub release are unaffected, and every file keeps its verified direct link in the announcement. Re-run this workflow: files Telegram already confirmed are skipped, so only the missing ones are retried."
              echo "delivered=false" >>"${GITHUB_OUTPUT}"
              ;;
          esac

          {
            echo
            echo "### APK / IPA delivery"
            echo
            if [[ -f "${RUNNER_TEMP}/telegram/assets.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/telegram/assets.json"
              echo '```'
            else
              echo "No asset report was produced (the step failed before it could run)."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
          # Whatever happened, no downloaded binary survives the job.
          rm -rf "${workspace}"

      - name: Record the announced release
        # Only after the send path reported a confirmed (or already-recorded)
        # announcement. A dry run never touches the ledger.
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.preflight != true) &&
          steps.publish.outputs.announced == 'true' && steps.release.outputs.dry_run != 'true'
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ledger=.github/telegram-releases.json
          if [[ ! -f "${ledger}" ]]; then
            echo "::warning::No post ledger was written; the channel pin remains the duplicate guard."
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- "${ledger}")" ]]; then
            echo "The post ledger already recorded release ${RELEASE_ID} (${RELEASE_TAG})."
            exit 0
          fi

          # The ledger is written only after Telegram confirmed every page. It is
          # committed so a future run can still recognise this announcement if the
          # channel's pin has since moved to another message.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ledger}"
          git commit -m "chore(telegram): record the ${RELEASE_TAG} announcement"
          # Best effort: a protected branch or a fork without write access must not
          # turn a delivered announcement into a failed run.
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::warning::The announcement was delivered but the post ledger could not be pushed. The pinned channel message still prevents a duplicate."
          fi
