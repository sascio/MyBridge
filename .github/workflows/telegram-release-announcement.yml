name: Retired legacy Telegram workflow

# This is the original workflow path/identity. Keep it disabled in GitHub even
# after the replacement is merged: historical refs can still contain its old,
# unsafe workflow definition. The replacement has a different workflow path.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Legacy Telegram workflow retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy execution
        run: |
          echo '::error::The legacy Telegram workflow is retired and must remain disabled. See docs/TELEGRAM-ANNOUNCEMENTS.md.'
          exit 1
