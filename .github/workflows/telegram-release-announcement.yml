name: Telegram release announcement

# Publishes a StreamBridge release announcement to the Telegram channel once a
# GitHub Release is published. Announcements only: this workflow never creates,
# edits, publishes or deletes a release, and it never touches the Android or iOS
# build jobs.
#
# Trigger: `release: published` only. Draft creation, tag pushes, ordinary pushes
# and pre-releases are not announced (the job re-checks draft/prerelease and the
# scripts exit cleanly for them anyway).
#
# Duplicate protection is the release id, not the event delivery:
#   * every page carries the hashtag `#SB<release id>` in its footer;
#   * before sending, `getChat` is read and the channel's pinned message is
#     checked for that tag;
#   * after a fully confirmed send, `.github/telegram-releases.json` records the
#     release id and the first message is pinned.
# A rerun, a retried job or a duplicated event therefore finds the tag and stops.
# `concurrency` below only keeps two runs from racing; it is not the protection.
#
# Credentials: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets, read
# into the step environment only. The token is never echoed, never passed as an
# argument and never written to an artifact; the script redacts it from any error
# it prints and masks it in the log.
#
# The bot must be an administrator of @StreamBridge_App with "Post Messages"
# (and "Pin Messages" for the pinned duplicate guard). Without pin rights the
# announcement still posts; only the pin step reports a warning.
#
# Manual runs: dispatch with `dry_run` checked to render and validate the exact
# messages without sending anything. Set `tag` to render a specific release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to render (empty = latest published release)
        required: false
        type: string
      dry_run:
        description: Render and validate the announcement without sending it
        required: false
        type: boolean
        default: true

permissions:
  # Read the release; write only for the post ledger commit at the end. No other
  # permission is requested: no releases API writes, no packages, no issues.
  contents: write

concurrency:
  # Serialise by release id when the id is known, so a rerun cannot interleave
  # with the run it is retrying. cancel-in-progress stays false: a run that is
  # already posting must be allowed to finish before the retry inspects the
  # channel.
  group: telegram-announcement-${{ github.event.release.id || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  announce:
    name: Announce the published release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official releases only: a draft or a pre-release is never announced.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)

    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the announcement tooling
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve the release to announce
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/telegram"
          release_json="${RUNNER_TEMP}/telegram/release.json"

          # Dry run by default on a manual dispatch; a `release: published` event
          # is the real announcement.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DRY_RUN_INPUT}" != "false" ]]; then
            echo "dry_run=true" >>"${GITHUB_OUTPUT}"
          else
            echo "dry_run=false" >>"${GITHUB_OUTPUT}"
          fi

          if [[ "${EVENT_NAME}" == "release" ]]; then
            # The event payload is only used to decide whether this release is
            # official; the announcement itself is always rendered from the API
            # object, which is the authoritative record of assets and URLs.
            if [[ "${EVENT_RELEASE_DRAFT}" != "false" || "${EVENT_RELEASE_PRERELEASE}" != "false" ]]; then
              echo "::notice::Release ${EVENT_RELEASE_TAG} is a draft or a pre-release; nothing is announced."
              echo "skip=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/${EVENT_RELEASE_ID}" >"${release_json}"
            echo "Reading release id ${EVENT_RELEASE_ID} (${EVENT_RELEASE_TAG}) through the API."
          elif [[ -n "${INPUT_TAG}" ]]; then
            # A manual dispatch for a specific tag. Drafts answer 404 here, which
            # is exactly the behaviour we want: drafts are never announced.
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${INPUT_TAG}" >"${release_json}"
            echo "Reading release ${INPUT_TAG} through the API."
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >"${release_json}"
            echo "Reading the latest published release through the API."
          fi

          python3 - "${release_json}" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("draft") or data.get("prerelease"):
              print("::notice::The resolved release is a draft or a pre-release; nothing is announced.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("skip=true\n")
              raise SystemExit(0)
          print(f"Release id {data['id']}, tag {data['tag_name']}, name {data.get('name')!r}, "
                f"assets {len(data.get('assets') or [])}, notes {len(data.get('body') or '')} chars")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"release_id={data['id']}\n")
              out.write(f"tag_name={data['tag_name']}\n")
              out.write(f"version={str(data['tag_name']).lstrip('v')}\n")
              out.write(f"asset_count={len(data.get('assets') or [])}\n")
              out.write("skip=false\n")
          PY

      - name: Validate the announcement without sending it
        env:
          RELEASE_JSON: ${{ runner.temp }}/telegram/release.json
        run: |
          set -euo pipefail
          # Always validate first, in every mode: a dispatch that sends must not
          # be able to post something the dry run would have rejected.
          python3 scripts/telegram_announce.py \
            --release-json "${RELEASE_JSON}" \
            --dry-run \
            --summary "${RUNNER_TEMP}/telegram/dry-run-summary.json"

      - name: Publish the announcement
        id: publish
        if: steps.release.outputs.skip != 'true'
        env:
          # Secrets reach the process through the environment only.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_JSON: ${{ runner.temp }}/telegram/release.json
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          args=(--release-json "${RELEASE_JSON}" --ledger .github/telegram-releases.json
                --summary "${RUNNER_TEMP}/telegram/summary.json")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          status=0
          python3 scripts/telegram_announce.py "${args[@]}" || status=$?
          case "${status}" in
            0)
              echo "announced=true" >>"${GITHUB_OUTPUT}"
              ;;
            2)
              echo "::notice title=Already announced::StreamBridge ${RELEASE_VERSION} was already announced to the Telegram channel; nothing was sent again."
              echo "announced=true" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error title=Telegram announcement failed::StreamBridge ${RELEASE_VERSION} was not announced (exit ${status}). The published GitHub release is unaffected. Fix the cause above and re-run this workflow: a duplicate cannot be posted, because the release id is checked before every send."
              exit "${status}"
              ;;
          esac
          {
            echo "### Telegram announcement — StreamBridge ${RELEASE_VERSION}"
            echo
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "**Dry run:** the messages above were rendered and validated, nothing was sent."
            else
              echo "The announcement for \`${RELEASE_TAG}\` was published to the StreamBridge Telegram channel."
            fi
            echo
            if [[ -f "${RUNNER_TEMP}/telegram/summary.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/telegram/summary.json"
              echo '```'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Record the announced release
        # Only after the send path reported a confirmed (or already-recorded)
        # announcement. A dry run never touches the ledger.
        if: steps.publish.outputs.announced == 'true' && steps.release.outputs.dry_run != 'true'
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ledger=.github/telegram-releases.json
          if [[ ! -f "${ledger}" ]]; then
            echo "::warning::No post ledger was written; the channel pin remains the duplicate guard."
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- "${ledger}")" ]]; then
            echo "The post ledger already recorded release ${RELEASE_ID} (${RELEASE_TAG})."
            exit 0
          fi

          # The ledger is written only after Telegram confirmed every page. It is
          # committed so a future run can still recognise this announcement if the
          # channel's pin has since moved to another message.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ledger}"
          git commit -m "chore(telegram): record the ${RELEASE_TAG} announcement"
          # Best effort: a protected branch or a fork without write access must not
          # turn a delivered announcement into a failed run.
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::warning::The announcement was delivered but the post ledger could not be pushed. The pinned channel message still prevents a duplicate."
          fi
