name: StreamBridge verified-upstream release watch

# Reports independently verified published tags; never imports a moving branch.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v8
        with:
          script: |
            const checkUpstreams = require('./.github/check_upstreams.cjs');
            await checkUpstreams({github, context, core});
