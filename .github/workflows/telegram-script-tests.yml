name: Telegram script checks

# Telegram delivery and recovery changes get the repository's offline script
# suite without provisioning Android/iOS build toolchains. Pull requests still
# run the normal full checks in build.yml.
on:
  push:
    branches: [main, arena/**]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/telegram-release-delivery.yml'
      - '.github/workflows/telegram-script-tests.yml'
      - 'docs/TELEGRAM-ANNOUNCEMENTS.md'
      - 'scripts/telegram_*.py'
      - 'scripts/tests/telegram-*.py'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/telegram-release-delivery.yml'
      - '.github/workflows/telegram-script-tests.yml'
      - 'docs/TELEGRAM-ANNOUNCEMENTS.md'
      - 'scripts/telegram_*.py'
      - 'scripts/tests/telegram-*.py'

permissions:
  contents: read

concurrency:
  group: telegram-script-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripts:
    name: Offline Telegram and release script tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Telegram test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'telethon==1.45.0' 'pyaes==1.6.1' 'rsa==4.9.1' 'pyasn1==0.6.1' 'PyYAML==6.0.2'
      - name: Run offline script tests
        run: scripts/tests/run-tests.sh

  # One-off, read-only investigation of the earlier intermittent lifecycle
  # failure. The report is only accessible to GitHub runners in this environment.
  download-test-diagnostic:
    name: Inspect earlier download test report
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[download-diagnostic]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Retrieve prior test report
        uses: actions/download-artifact@v7
        with:
          name: Stream-Bridge-unit-test-report
          run-id: 44762834187
          github-token: ${{ github.token }}
          path: prior-test-report
      - name: Report relevant failure details
        run: |
          python3 - <<'PY'
          import html
          import pathlib
          import re
          root = pathlib.Path('prior-test-report')
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix in ('.html', '.json', '.js')]
          found = False
          for path in files:
              data = path.read_text(encoding='utf-8', errors='replace')
              if 'backgroundExecutionDoesNotNeedRepositoryOrActivityCallbacks' not in data:
                  continue
              found = True
              print(f'::notice title=Previous download report::Found test in {path}')
              for block in re.findall(r'<pre[^>]*>(.*?)</pre>', data, re.DOTALL):
                  text = html.unescape(re.sub(r'<[^>]+>', '', block))
                  if 'backgroundExecutionDoesNotNeedRepositoryOrActivityCallbacks' not in text:
                      continue
                  # The old assertion did not include the underlying download error.
                  # Emit only the assertion and its relevant test frames, not logs.
                  for line in text.splitlines():
                      if 'AssertionError' in line or 'AndroidDownloadLifecycleTest' in line:
                          safe = line.strip().replace('%', '%25').replace('\r', '%0D')
                          print(f'::notice title=Previous download test::{safe[:800]}')
          if not found:
              print('::error title=Prior test report::Test name not found in report files')
              for path in files[:20]:
                  print(f'::notice title=Report file::{path}')
              raise SystemExit(1)
          PY
