name: Telegram script checks

# Telegram delivery and recovery changes get the repository's offline script
# suite without provisioning Android/iOS build toolchains. Pull requests still
# run the normal full checks in build.yml.
on:
  push:
    branches: [main, arena/**]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/telegram-script-tests.yml'
      - 'docs/TELEGRAM-ANNOUNCEMENTS.md'
      - 'scripts/telegram_*.py'
      - 'scripts/tests/telegram-*.py'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/telegram-script-tests.yml'
      - 'docs/TELEGRAM-ANNOUNCEMENTS.md'
      - 'scripts/telegram_*.py'
      - 'scripts/tests/telegram-*.py'

permissions:
  contents: read

concurrency:
  group: telegram-script-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripts:
    name: Offline Telegram and release script tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Telegram test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'telethon==1.45.0' 'pyaes==1.6.1' 'rsa==4.9.1' 'pyasn1==0.6.1' 'PyYAML==6.0.2'
      - name: Run offline script tests
        run: scripts/tests/run-tests.sh
