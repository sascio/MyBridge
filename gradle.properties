#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.mpp.enableCInteropCommonization=true

#Gradle — sized for GitHub Actions (do not allocate Nuvio's 12–16G iOS native heap)
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# StreamBridge always builds Nuvio's full Android distribution (plugins + P2P wiring + decoder AARs)
nuvio.android.distribution=full
